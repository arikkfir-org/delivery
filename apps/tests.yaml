apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: tests
  source:
    repoURL: https://github.com/arikkfir-org/delivery
    targetRevision: main
    path: platform/tests/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
