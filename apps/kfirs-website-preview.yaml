# Where cobranch.app's organization kfirs delivers its website's branches to preview them (platform/kfirs-website/preview):
# namespace kfirs-website-preview, one branch at a time, at https://preview.kfirs.com, and the account Cobranch's
# delivery applies there as, through a kubeconfig of its own that the organization keeps as a secret
# (docs/delivery/designs/kfirs-website.md). Argo CD makes the namespace and the account; Cobranch delivers what runs in
# it. Policies kfirs-website-* (Application kfirs-website) hold what it delivers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kfirs-website-preview
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kfirs-website-preview
  source:
    repoURL: https://github.com/arikkfir-org/delivery
    targetRevision: main
    path: platform/kfirs-website/preview
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Public on purpose, as the website itself is: a preview of a public site. Listener preview-kfirs-com admits no
    # other labelled namespace, and policy kfirs-website-http-routes holds this one's routes to it.
    managedNamespaceMetadata:
      labels:
        kfirs.com/public-ingress: "true"
        pod-security.kubernetes.io/enforce: restricted
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
