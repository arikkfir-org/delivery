# Go import pages for every hub domain that is a Go module path: fin.kfirs.com (arikkfir-org/fin) and octomaton.dev
# (arikkfir-org/octomaton). Wave 4: its route needs Traefik's Gateway API.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-import
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: go-import
  source:
    repoURL: https://github.com/arikkfir-org/delivery
    targetRevision: main
    path: platform/go-import/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        kfirs.com/public-ingress: "true"
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
