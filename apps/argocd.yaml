# Argo CD manages itself: same chart, version and release name that Terraform bootstrapped. Wave 2, after
# external-secrets and gateway-api, whose CRDs its ExternalSecret and HTTPRoute use. No resources finalizer: removing
# this file must never delete Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Synced with server-side apply, the Application would diff by structured merge, which can't add CRD defaults: the
    # HTTPRoute's atomic lists (parentRefs, rules, backendRefs) would never match the live, defaulted route. A
    # server-side dry run adds them.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.4
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/argocd/values.yaml
    - repoURL: https://github.com/arikkfir-org/delivery
      targetRevision: main
      ref: values
    - repoURL: https://github.com/arikkfir-org/delivery
      targetRevision: main
      path: platform/argocd/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
