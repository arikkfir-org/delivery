# Octomaton's environment (platform/octomaton): its project and Application octomaton, which deploys deploy/ of
# arikkfir-org/octomaton. Not named octomaton, so the deployment can be Application octomaton. Wave 4: Octomaton's
# deployment needs External Secrets and Traefik's Gateway API. No resources finalizer: removing this file must never
# delete Octomaton.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: octomaton-environment
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/arikkfir-org/delivery
    targetRevision: main
    path: platform/octomaton/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
