apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: octomaton
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: octomaton
  # Octomaton's manifests live with its code. Argo CD follows that repository's main and runs the image of the synced
  # commit: Octomaton's release publishes one for every push to main, tagged with the commit's short SHA.
  source:
    repoURL: https://github.com/arikkfir-org/octomaton
    targetRevision: main
    path: deploy
    kustomize:
      images:
        - "me-west1-docker.pkg.dev/arikkfir/images/octomaton:${ARGOCD_APP_REVISION_SHORT}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        kfirs.com/public-ingress: "true"
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
