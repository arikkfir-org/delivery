# What is left of DevHub's demo environment (platform/devhub) since ENG-221 renamed it Cobranch
# (apps/cobranch-environment.yaml): the projects and policies Argo CD needs while it deletes the old demo and previews.
# For the move only, a resources finalizer, so that removing this file deletes what it still holds rather than leaving
# it unmanaged. Wave 4.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devhub-environment
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/arikkfir-org/delivery
    targetRevision: main
    path: platform/devhub/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - SkipDryRunOnMissingResource=true
