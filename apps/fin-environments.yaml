# Fin's environments (platform/fin): production's Application fin, the ApplicationSet of pull requests' deployments,
# their projects, and the admission policies that hold what Fin's code deploys to its own namespaces and host names.
# Wave 4: Fin's deployment needs cert-manager, External Secrets and Traefik's Gateway API. No resources finalizer:
# removing this file must never delete production.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fin-environments
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/arikkfir-org/delivery
    targetRevision: main
    path: platform/fin/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
