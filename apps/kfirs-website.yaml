# Where cobranch.app's organization kfirs delivers its repository website (platform/kfirs-website): namespace
# kfirs-website and the account Cobranch's delivery applies there as, through a kubeconfig the organization keeps as a
# secret (docs/delivery/designs/kfirs-website.md). Argo CD makes the namespace and the account; Cobranch delivers what
# runs in it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kfirs-website
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kfirs-website
  source:
    repoURL: https://github.com/arikkfir-org/delivery
    targetRevision: main
    path: platform/kfirs-website/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Public on purpose: the website is www.kfirs.com, the family's public site, with no sign-in. Listeners kfirs-com
    # and www-kfirs-com admit no other labelled namespace, and policy kfirs-website-http-routes holds this one's routes
    # to them.
    managedNamespaceMetadata:
      labels:
        kfirs.com/public-ingress: "true"
        pod-security.kubernetes.io/enforce: restricted
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
