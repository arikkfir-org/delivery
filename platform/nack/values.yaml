# JetStream controller; its CRDs ship in the chart's crds/ directory, which Argo CD applies. Its control-loop mode is the
# one that applies KeyValue resources, as Fin's buckets are, as well as streams and consumers: the legacy mode ignores
# them.
jetstream:
  enabled: true
  controlLoop: true
  nats:
    url: nats://nats.nats.svc.cluster.local:4222

# The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
nodeSelector:
  kfirs.com/pool: system
tolerations:
  - key: components.gke.io/gke-managed-components
    operator: Equal
    value: "true"
    effect: NoSchedule
