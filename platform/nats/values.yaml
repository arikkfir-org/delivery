# Three clustered NATS servers with JetStream on a file store; clients use nats://nats.nats.svc.cluster.local:4222.
# Each server has its own 50Gi volume (a volumeClaimTemplate), so a stream can keep up to three replicas.
config:
  cluster:
    enabled: true
    replicas: 3
  jetstream:
    enabled: true
    fileStore:
      enabled: true
      pvc:
        enabled: true
        size: 50Gi

# What each server and its config reloader use, memory limits above their peaks. CPU unlimited, against the chart's
# advice: a CPU limit throttles in 100 ms slices, slowing every client even on an idle node
# (docs/delivery/designs/resource-requests.md).
container:
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 512Mi
reloader:
  merge:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

# Prefer separate nodes, without forcing the system pool to grow to three nodes.
podTemplate:
  topologySpreadConstraints:
    kubernetes.io/hostname:
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
  # The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
  merge:
    spec:
      nodeSelector:
        kfirs.com/pool: system
      tolerations:
        - key: components.gke.io/gke-managed-components
          operator: Equal
          value: "true"
          effect: NoSchedule

natsBox:
  enabled: true
  # Idle but for commands run in it by hand, which share its memory limit.
  container:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 256Mi
  podTemplate:
    merge:
      spec:
        nodeSelector:
          kfirs.com/pool: system
        tolerations:
          - key: components.gke.io/gke-managed-components
            operator: Equal
            value: "true"
            effect: NoSchedule
