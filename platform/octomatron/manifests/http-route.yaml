# The GitHub App's webhook is the only public path; deliveries are verified with the webhook secret (HMAC).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: octomatron
  namespace: octomatron
  labels:
    app.kubernetes.io/name: octomatron
spec:
  parentRefs:
    - name: public
      namespace: traefik
  hostnames:
    - octomatron.kfirs.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - name: octomatron
          port: 80
