# Keycloak itself, run by the operator (apps/keycloak-operator.yaml). Wave 1 waits for the database.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 2
  image: quay.io/keycloak/keycloak:26.8.0
  # Naming an image makes the operator start it --optimized, which the stock image, never built for PostgreSQL or the
  # file vault, can't run.
  startOptimized: false
  db:
    vendor: postgres
    host: postgres
    database: keycloak
    usernameSecret:
      name: keycloak-db
      key: username
    passwordSecret:
      name: keycloak-db
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: https://id.kfirs.com
    admin: https://admin.id.kfirs.com
    # Terraform reaches the admin API through the in-cluster Service.
    backchannelDynamic: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  bootstrapAdmin:
    service:
      secret: keycloak-bootstrap-admin
  additionalOptions:
    - name: vault
      value: file
    - name: vault-dir
      value: /opt/keycloak/vault
  networkPolicy:
    enabled: true
    http:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ci-infra
      # Fin's end-to-end runs create and delete their test users through the admin API.
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ci-fin
  scheduling:
    # The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md). The operator takes no
    # node selector, so a required node affinity names the pool.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kfirs.com/pool
                  operator: In
                  values:
                    - system
    tolerations:
      - key: components.gke.io/gke-managed-components
        operator: Equal
        value: "true"
        effect: NoSchedule
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: keycloak
            app.kubernetes.io/instance: keycloak
  # What each instance uses (hub/designs/resource-requests.md in arikkfir-org/docs). Java takes 70% of the memory limit
  # for its heap, so the limit is the one Keycloak's sizing guide gives for 10,000 sessions, far more than the hub has.
  # CPU stays unlimited: every sign-in hashes a password, and the guide reports throttling slows Keycloak badly.
  resources:
    requests:
      cpu: 25m
      memory: 1Gi
    limits:
      memory: 1360Mi
  unsupported:
    podTemplate:
      spec:
        containers:
          - name: keycloak
            volumeMounts:
              - name: vault
                mountPath: /opt/keycloak/vault
                readOnly: true
        volumes:
          - name: vault
            secret:
              secretName: keycloak-vault
