# The operator's bootstrap admin: a temporary service account in the master realm, used once for the first apply.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
    template:
      data:
        client-id: bootstrap-admin
        client-secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: keycloak-bootstrap-admin
---
# Keycloak's file vault: "${vault.google-client-secret}" reads file <realm>_google-client-secret, the same Google client
# secret for realms hub and master.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-vault
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: keycloak-vault
    creationPolicy: Owner
  data:
    - secretKey: hub_google-client-secret
      remoteRef:
        key: keycloak-google-client-secret
    - secretKey: master_google-client-secret
      remoteRef:
        key: keycloak-google-client-secret
