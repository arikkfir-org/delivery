# The operator makes none. One per Deployment it installs, selecting what that Deployment selects, so no pod falls under
# two (an eviction refuses a pod with two budgets). Most run one replica, which a drain may evict; the webhooks'
# HorizontalPodAutoscalers may run more, and the budget then keeps all but one serving
# (docs/delivery/designs/disruption-budgets.md).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tekton-pipelines-controller
  namespace: tekton-pipelines
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controller
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: default
      app.kubernetes.io/part-of: tekton-pipelines
---
