# Octomatron's check-run links point here: https://tekton.kfirs.com/#/namespaces/<namespace>/pipelineruns/<name>
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
spec:
  parentRefs:
    - name: protected
      namespace: traefik
  hostnames:
    - tekton.kfirs.com
  rules:
    - backendRefs:
        - name: tekton-dashboard
          port: 9097
