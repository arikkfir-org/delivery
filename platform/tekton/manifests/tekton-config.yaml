# Field names follow the tekton-operator v0.81.1 API (pkg/apis/operator/v1alpha1); check the Go types for the pinned
# version when changing this file. A field the running operator does not know is refused or dropped, never applied.
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  profile: all
  targetNamespace: tekton-pipelines
  # Everything the operator installs, the pruner's CronJob included, on the system node pool, beside GKE's own
  # components (docs/delivery/designs/node-pools.md). The operator sets these on every Deployment and StatefulSet it
  # makes, replacing theirs. TaskRun pods follow the default pod template below instead.
  config:
    nodeSelector:
      kfirs.com/pool: system
    tolerations:
      - key: components.gke.io/gke-managed-components
        operator: Equal
        value: "true"
        effect: NoSchedule
  # Cron-based pruner (tkn), per namespace. TaskRuns and pods go with their PipelineRuns (owner references).
  pruner:
    disabled: false
    resources:
      - pipelinerun
    keep: 30
    schedule: "0 * * * *"
  dashboard:
    readonly: false
    # When a step's pod is gone (the autoscaler removes an empty CI node about a minute after its last pod ends, and
    # its pods go with it), the Dashboard's backend asks octomaton-logs, which reads the step's log from Cloud Logging:
    # GET <this>/<namespace>/<pod>/<container>?startTime=…&completionTime=… (deploy/ in arikkfir-org/octomaton).
    external-logs: http://octomaton-logs.octomaton.svc.cluster.local/logs
  chain:
    disabled: true
  # Profile "all" would also install Tekton Results (with its own PostgreSQL); the hub uses Pipelines, Triggers and the
  # Dashboard only. The CRD requires is_external_db even so.
  result:
    disabled: true
    is_external_db: false
  # Octomaton is the hub's CI. On Kubernetes the operator installs Pipelines-as-Code unless told not to.
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: false
  # The operator's own NetworkPolicies would put default-deny policies in tekton-pipelines, whose pods serve admission
  # webhooks.
  networkPolicy:
    disabled: true
  pipeline:
    default-service-account: pipeline
    # No affinity assistant. It pins every pod that shares a run's volume to the node holding it, so on a full node they
    # wait: the cluster autoscaler can't add a node they would fit on. Without it, each pod goes wherever it fits and
    # the volume follows. Tasks sharing a volume must then run one after another, as the reviewer's do.
    coschedule: disabled
    # Every TaskRun pod runs on the "ci" node pool.
    default-pod-template: |
      nodeSelector:
        kfirs.com/pool: ci
      tolerations:
        - key: kfirs.com/pool
          operator: Equal
          value: ci
          effect: NoSchedule
    # What each component uses (hub/designs/resource-requests.md in arikkfir-org/docs). The operator replaces a named
    # container's whole resources with these, so each restates the limits it keeps. The pipelines webhook keeps its
    # 100m: its HorizontalPodAutoscaler adds replicas at 100% of it, up to five.
    options:
      deployments:
        tekton-pipelines-controller:
          spec:
            template:
              spec:
                containers:
                  - name: tekton-pipelines-controller
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        memory: 512Mi
        tekton-pipelines-remote-resolvers:
          spec:
            template:
              spec:
                containers:
                  - name: controller
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: "1"
                        memory: 4Gi
        tekton-operator-proxy-webhook:
          spec:
            template:
              spec:
                containers:
                  - name: proxy
                    resources:
                      requests:
                        cpu: 10m
                        memory: 48Mi
                      limits:
                        cpu: 500m
                        memory: 500Mi
