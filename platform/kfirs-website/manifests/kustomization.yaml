# The namespace cobranch.app's organization kfirs delivers its website into, the account it applies as, and the
# admission policies that keep what it delivers inside the cluster (docs/delivery/designs/kfirs-website.md). The
# namespaced objects take Application kfirs-website's destination namespace; the policies are cluster-scoped.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - admission-policies.yaml
  - delivery-account.yaml
