# What Cobranch delivers into namespaces kfirs-website and kfirs-website-preview, from the website's branches, which
# this repository doesn't review, stays inside the cluster: its Services are of type ClusterIP with no external IPs, and
# its HTTPRoutes attach only to listeners kfirs-com and www-kfirs-com of Gateway traefik/public from kfirs-website, and
# only to listener preview-kfirs-com from kfirs-website-preview (docs/delivery/designs/kfirs-website.md); never to
# traefik/protected, nor to listener public-websecure of traefik/public, which take routes for any *.kfirs.com host.
# Matched by the namespaces' names. Wave -1: in force before the accounts exist.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kfirs-website-cluster-ip-services
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - services
  matchConditions:
    - name: kfirs-website
      expression: "request.namespace in ['kfirs-website', 'kfirs-website-preview']"
    # Deleting an object, the garbage collector drops its finalizer with an update that leaves the spec as it was; that
    # update passes, so an object made before this policy last tightened still goes. Every other update is checked.
    - name: changed
      expression: >-
        request.operation == 'CREATE' || !has(oldObject.metadata.deletionTimestamp) || object.spec != oldObject.spec
  validations:
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: A Service in namespaces kfirs-website and kfirs-website-preview is of type ClusterIP.
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: A Service in namespaces kfirs-website and kfirs-website-preview has no external IPs.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kfirs-website-cluster-ip-services
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: kfirs-website-cluster-ip-services
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kfirs-website-http-routes
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - gateway.networking.k8s.io
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - httproutes
  matchConditions:
    - name: kfirs-website
      expression: "request.namespace in ['kfirs-website', 'kfirs-website-preview']"
    # As for Services above.
    - name: changed
      expression: >-
        request.operation == 'CREATE' || !has(oldObject.metadata.deletionTimestamp) || object.spec != oldObject.spec
  variables:
    - name: parents
      expression: "has(object.spec.parentRefs) ? object.spec.parentRefs : []"
    - name: listeners
      expression: >-
        request.namespace == 'kfirs-website' ? ['kfirs-com', 'www-kfirs-com'] : ['preview-kfirs-com']
  validations:
    - expression: >-
        size(variables.parents) > 0 && variables.parents.all(p, (!has(p.group) || p.group == 'gateway.networking.k8s.io')
          && (!has(p.kind) || p.kind == 'Gateway')
          && has(p.namespace) && p.namespace == 'traefik' && p.name == 'public'
          && has(p.sectionName) && p.sectionName in variables.listeners)
      messageExpression: >-
        'An HTTPRoute in namespace ' + request.namespace + ' attaches to listeners ' + variables.listeners.join(', ')
        + ' of Gateway traefik/public only.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kfirs-website-http-routes
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: kfirs-website-http-routes
  validationActions:
    - Deny
