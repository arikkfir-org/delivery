# The account cobranch.app's delivery applies as, for target preview of repository kfirs/website: as in namespace
# kfirs-website (platform/kfirs-website/manifests), with a token of its own, so production's kubeconfig never reaches
# the previews nor theirs production.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cobranch-delivery
automountServiceAccountToken: false
---
# The account's token, which Kubernetes writes here and keeps until this Secret is deleted: deleting it revokes the
# organization's kubeconfig.
apiVersion: v1
kind: Secret
metadata:
  name: cobranch-delivery-token
  annotations:
    kubernetes.io/service-account.name: cobranch-delivery
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cobranch-delivery
rules:
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cobranch-delivery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cobranch-delivery
subjects:
  - kind: ServiceAccount
    name: cobranch-delivery
    namespace: kfirs-website-preview
---
# Cobranch reads an environment's namespace before it delivers: one it may not read, it tries to make. Reading this one
# alone lets it use it as it is.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kfirs-website-preview-namespace
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kfirs-website-preview]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kfirs-website-preview-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kfirs-website-preview-namespace
subjects:
  - kind: ServiceAccount
    name: cobranch-delivery
    namespace: kfirs-website-preview
