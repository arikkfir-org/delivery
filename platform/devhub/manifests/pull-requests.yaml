# A DevHub of every open pull request of devhub labelled preview, whatever its base branch: namespace
# devhub-pr-<number>, at https://pr-<number>.devhub-previews.dev.kfirs.com, the APIs under /api and /graphql, through
# the shared Gateway traefik/devhub-pull-requests (pull-requests-gateway.yaml), running the pull request's head commit,
# seeded with demo data (docs/delivery/designs/devhub-previews.md). The generator lists devhub's pull requests through
# Argo CD's GitHub App (Secret github-app, platform/argocd) every minute; when a pull request closes, merges or loses
# the label, its Application goes and the resources finalizer deletes the preview, namespace and database included. It
# names the preview from the pull request's number and the commit from its head SHA, never from a title; the template
# uses those alone. Two sources: the chart from the head commit, and what the hub decides around it from delivery's
# main (platform/devhub/pull-request), which holds the Namespace, so no CreateNamespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devhub-pull-requests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - pullRequest:
        github:
          owner: arikkfir-org
          repo: devhub
          appSecretName: github-app
          # devhub is public, and the generator lists forks' pull requests too, whose head commits this repoURL serves:
          # a fork's chart would run what it likes on pool ci. Only people with triage access to devhub can label.
          labels:
            - preview
        requeueAfterSeconds: 60
        values:
          env: "pr-{{ .number }}"
          revision: "{{ .head_sha }}"
          # The images' tag, as devhub's pipeline preview writes it: the commit's first seven characters.
          tag: "{{ trunc 7 .head_sha }}"
  template:
    metadata:
      name: "devhub-{{ .values.env }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: devhub-pull-requests
      destination:
        server: https://kubernetes.default.svc
        namespace: "devhub-{{ .values.env }}"
      sources:
        - repoURL: https://github.com/arikkfir-org/devhub
          targetRevision: "{{ .values.revision }}"
          path: chart/devhub
          helm:
            releaseName: devhub
            # helm test's pod is for a person or CI to run, not for every sync.
            skipTests: true
            # As strings: a short SHA can be all digits.
            parameters:
              - name: images.devhub.tag
                value: "{{ .values.tag }}"
                forceString: true
              - name: images.console.tag
                value: "{{ .values.tag }}"
                forceString: true
            valuesObject:
              # devhub's pipeline preview pushes every pushed head commit's images there; only previews pull from it.
              images:
                devhub:
                  repository: me-west1-docker.pkg.dev/arikkfir/devhub-previews/devhub
                console:
                  repository: me-west1-docker.pkg.dev/arikkfir/devhub-previews/devhub-console
              # One host, whose route (platform/devhub/pull-request) strips each API's prefix.
              urls:
                console: "https://{{ .values.env }}.devhub-previews.dev.kfirs.com"
                rest: "https://{{ .values.env }}.devhub-previews.dev.kfirs.com/api"
                graphql: "https://{{ .values.env }}.devhub-previews.dev.kfirs.com/graphql"
              # No cloud role: a directory of each server's own, gone with its pod.
              blob:
                url: file:///var/lib/devhub/blobs
                volume:
                  emptyDir: {}
              # The demo data a reviewer starts from (devhub's db/seeds/).
              seed:
                enabled: true
              # A preview has no availability to keep. Every pod on pool ci, which policy devhub-node-pool holds.
              restServer:
                replicas: 1
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              graphqlServer:
                replicas: 1
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              console:
                replicas: 1
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              migrate:
                # A sync can start before pipeline preview has pushed the commit's images: the Job waits for its image within
                # this deadline, and the servers and the Console wait for the Job.
                activeDeadlineSeconds: 1800
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              postgresql:
                # Generated in the namespace (platform/devhub/pull-request): the chart's own would change at every render.
                auth:
                  existingSecret: devhub-postgresql-password
                storage:
                  size: 1Gi
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
        - repoURL: https://github.com/arikkfir-org/delivery
          targetRevision: main
          path: platform/devhub/pull-request
          kustomize:
            namespace: "devhub-{{ .values.env }}"
            patches:
              - target:
                  kind: HTTPRoute
                  name: devhub
                patch: |-
                  - op: replace
                    path: /spec/hostnames
                    value:
                      - "{{ .values.env }}.devhub-previews.dev.kfirs.com"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Each retry syncs the head commit again; a newer push makes a new commit, whose migrate Job has a new name.
        retry:
          limit: 2
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - SkipDryRunOnMissingResource=true
