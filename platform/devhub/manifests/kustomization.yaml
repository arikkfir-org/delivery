# What is left of DevHub, which ENG-221 renamed Cobranch (platform/cobranch): the projects and admission policies Argo CD
# needs while the resources finalizers of Application devhub and ApplicationSet devhub-pull-requests delete the old demo
# and previews (docs/delivery/designs/cobranch.md). A later pull request removes it with apps/devhub-environment.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - project.yaml
  - pull-requests-project.yaml
  - namespaces-policy.yaml
  - services-policy.yaml
  - http-routes-policy.yaml
  - middlewares-policy.yaml
  - external-secrets-policy.yaml
  - disruption-budgets-policy.yaml
  - node-pool-policy.yaml
