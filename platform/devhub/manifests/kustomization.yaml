# DevHub's demo environment: its namespace and project, the Application that installs devhub's chart from its main,
# and what the hub decides around it (docs/delivery/designs/devhub.md): the database's password, the route behind the
# hub's sign-in and group admins, and who reaches the pods.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - project.yaml
  - postgresql-password.yaml
  - devhub.yaml
  - http-route.yaml
  - middleware.yaml
  - network-policy.yaml
