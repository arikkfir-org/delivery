# DevHub's demo. Its pods meet the restricted Pod Security Standard, as the chart writes them. Wave -1: before the
# password and the Application that deploy into it.
apiVersion: v1
kind: Namespace
metadata:
  name: devhub
  labels:
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
