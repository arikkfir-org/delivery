# DevHub's demo on one host, behind the protected gateway's sign-in and Middleware admins. Each workload serves as if it
# were alone (the Console and GraphQL at /, REST under /v1/), so each API's prefix is stripped, as the chart's urls say:
# /api/v1/version reaches the REST server as /v1/version. One host keeps the Console's calls same-origin, so the
# sign-in's cookie goes with them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devhub
  namespace: devhub
  labels:
    app.kubernetes.io/name: devhub
spec:
  parentRefs:
    - name: protected
      namespace: traefik
  hostnames:
    - devhub.dev.kfirs.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: admins
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: devhub-rest-server
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /graphql
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: admins
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: devhub-graphql-server
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: admins
      backendRefs:
        - name: devhub-console
          port: 80
