# DevHub's demo, namespace devhub, at devhub.dev.kfirs.com. Its chart lives with its code, in chart/devhub of
# arikkfir-org/devhub. Argo CD follows devhub's main and runs the images of the synced commit, which devhub's pipeline
# main publishes for every push to main, tagged with the commit's short SHA. Each sync migrates the database first (the
# chart's migrate Job, ordered by its sync waves). No CreateNamespace: namespace.yaml holds it. No resources finalizer:
# deleting this Application leaves the demo, and its database, running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devhub
  namespace: argocd
spec:
  project: devhub
  destination:
    server: https://kubernetes.default.svc
    namespace: devhub
  source:
    repoURL: https://github.com/arikkfir-org/devhub
    targetRevision: main
    path: chart/devhub
    helm:
      releaseName: devhub
      # helm test's pod is for a person or CI to run, not for every sync.
      skipTests: true
      # The synced commit's images. As strings: a short SHA can be all digits.
      parameters:
        - name: images.devhub.tag
          value: ${ARGOCD_APP_REVISION_SHORT}
          forceString: true
        - name: images.console.tag
          value: ${ARGOCD_APP_REVISION_SHORT}
          forceString: true
      valuesObject:
        images:
          devhub:
            repository: me-west1-docker.pkg.dev/arikkfir/devhub/devhub
          console:
            repository: me-west1-docker.pkg.dev/arikkfir/devhub/devhub-console
        # One host behind the protected gateway's sign-in, whose routes (http-route.yaml) strip each API's prefix.
        urls:
          console: https://devhub.dev.kfirs.com
          rest: https://devhub.dev.kfirs.com/api
          graphql: https://devhub.dev.kfirs.com/graphql
        # infra's bucket, which only the servers' ServiceAccount, devhub-server, reaches through Workload Identity.
        blob:
          url: gs://arikkfir-devhub
        # Every pod on the system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
        restServer:
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
        graphqlServer:
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
        console:
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
        migrate:
          # A sync can start before main's pipeline has published the commit's images; the Job's pod waits for them
          # (pulls back off to five minutes apart) within this deadline, which leaves the pipeline about 25 minutes.
          activeDeadlineSeconds: 1800
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
        postgresql:
          # Generated once in the cluster (postgresql-password.yaml): the chart's own would change at every render.
          auth:
            existingSecret: devhub-postgresql-password
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
