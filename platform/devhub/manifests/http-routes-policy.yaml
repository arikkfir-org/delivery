# In a DevHub preview an HTTPRoute names only its own host, pr-<number>.devhub.dev.kfirs.com, and attaches only
# to traefik/devhub-pull-requests, which every preview shares (pull-requests-gateway.yaml); never traefik/protected,
# which takes routes for any *.kfirs.com host from every namespace. Every rule asks Middleware admins first, then
# removes Cookie, then may only rewrite the URL: the hub's sign-in admits every hub user, Fin's test users included, and
# Traefik runs filters in order, so a redirect or mirror before admins would answer them; browsers send the hub's
# session cookie (domain .kfirs.com) here too, which a pull request's code never gets. Matched by the namespace's name.
# Wave -1: in force before any preview.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devhub-http-routes
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - gateway.networking.k8s.io
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - httproutes
  matchConditions:
    - name: preview
      expression: "request.namespace.startsWith('devhub-pr-')"
    # Deleting an object, the garbage collector drops its finalizer with an update that leaves the spec as it was; that
    # update passes, so an object made before this policy last tightened still goes. Every other update is checked.
    - name: changed
      expression: >-
        request.operation == 'CREATE' || !has(oldObject.metadata.deletionTimestamp) || object.spec != oldObject.spec
  variables:
    # devhub-pr-<number> serves pr-<number>.devhub.dev.kfirs.com.
    - name: host
      expression: "request.namespace.substring(7) + '.devhub.dev.kfirs.com'"
  validations:
    - expression: >-
        has(object.spec.hostnames) && size(object.spec.hostnames) > 0
        && object.spec.hostnames.all(h, h == variables.host)
      messageExpression: "'An HTTPRoute in ' + request.namespace + ' names one host, ' + variables.host"
    - expression: >-
        has(object.spec.parentRefs) && size(object.spec.parentRefs) > 0
        && object.spec.parentRefs.all(p, (!has(p.group) || p.group == 'gateway.networking.k8s.io')
          && (!has(p.kind) || p.kind == 'Gateway')
          && has(p.namespace) && p.namespace == 'traefik' && p.name == 'devhub-pull-requests')
      message: An HTTPRoute in a DevHub preview attaches to Gateway traefik/devhub-pull-requests only.
    - expression: >-
        has(object.spec.rules) && object.spec.rules.all(r, has(r.filters) && size(r.filters) >= 2
          && r.filters[0].type == 'ExtensionRef' && has(r.filters[0].extensionRef)
          && r.filters[0].extensionRef.group == 'traefik.io' && r.filters[0].extensionRef.kind == 'Middleware'
          && r.filters[0].extensionRef.name == 'admins'
          && r.filters[1].type == 'RequestHeaderModifier' && has(r.filters[1].requestHeaderModifier)
          && has(r.filters[1].requestHeaderModifier.remove)
          && r.filters[1].requestHeaderModifier.remove.exists(name, name.lowerAscii() == 'cookie')
          && (size(r.filters) == 2 || (size(r.filters) == 3 && r.filters[2].type == 'URLRewrite')))
      message: >-
        Every rule of an HTTPRoute in a DevHub preview asks Middleware admins first, then removes the Cookie header, then
        may only rewrite the URL.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devhub-http-routes
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: devhub-http-routes
  validationActions:
    - Deny
