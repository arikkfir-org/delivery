# The project of DevHub's demo. Its source, chart/devhub in arikkfir-org/devhub, comes from devhub's main, so every merge
# there changes the cluster; this holds it to namespace devhub and the kinds the chart renders there: the servers', the
# Console's and PostgreSQL's workloads, Services, budgets and the database's NetworkPolicy, the servers' ServiceAccount
# and the migrate Job. No cluster-scoped kinds (namespace.yaml holds the Namespace), no Secrets (the database's password
# is postgresql-password.yaml's), no routes (http-route.yaml). Wave -1: before the Application that names it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devhub
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: DevHub's demo, from devhub's main.
  sourceRepos:
    - https://github.com/arikkfir-org/devhub
  destinations:
    - server: https://kubernetes.default.svc
      namespace: devhub
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: batch
      kind: Job
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
