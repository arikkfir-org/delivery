# A preview's namespace, which goes with its pull request. Its pods meet the restricted Pod Security Standard, as the
# chart writes them. kfirs.com/devhub-pull-request keeps ClusterSecretStore gcp-secret-manager out of its reach and
# admits its route to Gateway traefik/devhub-pull-requests; policy devhub-namespaces holds both labels. Wave -1: before
# everything that goes in it.
apiVersion: v1
kind: Namespace
metadata:
  name: devhub-pr
  labels:
    pod-security.kubernetes.io/enforce: restricted
    kfirs.com/devhub-pull-request: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
