# A preview on two hosts, on the Gateway every preview shares, behind the hub's sign-in and Middleware admins, as the
# demo is: the Console at pr-<number>.devhub.dev.kfirs.com, and its APIs at api-pr-<number>.devhub.dev.kfirs.com, REST
# at the root (/v1/...) and GraphQL under /graphql, whose prefix is stripped, since each workload serves as if it were
# alone. One label below devhub.dev, so the Gateway's one wildcard certificate covers both. Every rule asks admins
# first, which reads the hub's session cookie, then removes Cookie: browsers send that cookie (domain .kfirs.com) here
# too, and a pull request's code never gets it. Policy devhub-http-routes holds all of this.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devhub-console
  labels:
    app.kubernetes.io/name: devhub
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik
      name: devhub-pull-requests
  hostnames:
    - pr-0.devhub.dev.kfirs.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: admins
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Cookie
      backendRefs:
        - name: devhub-console
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devhub-api
  labels:
    app.kubernetes.io/name: devhub
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik
      name: devhub-pull-requests
  hostnames:
    - api-pr-0.devhub.dev.kfirs.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /graphql
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: admins
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Cookie
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: devhub-graphql-server
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: admins
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Cookie
      backendRefs:
        - name: devhub-rest-server
          port: 80
