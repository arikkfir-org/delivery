# CI tenants: one namespace per repository (ci-<repository>; ".github" is "ci-github").
# To onboard a repository: copy a directory under tenants/, change its "namespace", and add it below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - tenants/github
  - tenants/infra
  - tenants/delivery
  - tenants/switchboard
  - tenants/tooling
  - tenants/docs
