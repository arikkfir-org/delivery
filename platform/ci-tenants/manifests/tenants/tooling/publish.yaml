# Identity of tooling's publish and reviewer-image pipelines (see https://docs.dev.kfirs.com/infra/terraform/gcp.md,
# "IAM"): terraform/gcp lets it write the public arikkfir-claude bucket and Artifact Registry repository images through
# Workload Identity. Octomaton refuses any run that names it unless the run's branch is main.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-tooling-publish
  annotations:
    octomaton.dev/branches: main
automountServiceAccountToken: false
