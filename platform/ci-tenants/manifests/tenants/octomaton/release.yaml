# Identity of octomaton's release pipeline (see the reference, "GCP identities and permissions"): terraform/gcp lets it
# push to the images repository through Workload Identity. Octomaton refuses any run that names it unless the run's
# branch is main.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-octomaton-release
  annotations:
    octomaton.dev/branches: main
automountServiceAccountToken: false
