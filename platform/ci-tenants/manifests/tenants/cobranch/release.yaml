# Identity of cobranch's main and tag pipelines (see https://docs.dev.kfirs.com/infra/terraform/gcp.md, "IAM"):
# terraform/gcp lets it push to the cobranch repository through Workload Identity. Octomaton refuses any run that names
# it unless the run's branch is main or its tag is a version (v1.2.3, created by publishing a GitHub release).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-cobranch-release
  annotations:
    octomaton.dev/branches: main
    octomaton.dev/tags: v*
automountServiceAccountToken: false
