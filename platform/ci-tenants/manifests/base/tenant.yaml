# One CI tenant. Each tenants/<name>/kustomization.yaml sets "namespace: ci-<name>", which also renames this Namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: ci-tenant
---
# Identity of every PipelineRun that names no other ServiceAccount (Tekton's default), which any branch's run can use,
# so it must hold no GCP role: a pipeline that needs one names a ServiceAccount of its own (see
# https://docs.dev.kfirs.com/delivery/platform.md, "CI tenants").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: octomaton
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: octomaton-tenant
subjects:
  - kind: ServiceAccount
    name: octomaton
    namespace: octomaton
