# One CI tenant. Each tenants/<name>/kustomization.yaml sets "namespace: ci-<name>", which also renames this Namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: ci-tenant
---
# Identity of every PipelineRun in the namespace (Tekton default service account); GCP roles bind to it directly
# through Workload Identity (see the reference, "GCP identities and permissions").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: octomaton
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: octomaton-tenant
subjects:
  - kind: ServiceAccount
    name: octomaton
    namespace: octomaton
