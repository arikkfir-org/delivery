# Identities of the docs site's organization pipelines, from arikkfir-org/tooling (see the reference, "Docs site").
# terraform/gcp binds their roles on bucket arikkfir-docs through Workload Identity; neither needs a Kubernetes API
# token.

# The Docs check, on pull requests and merge groups: lists the bucket's object names, reads nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docs-reader
automountServiceAccountToken: false
---
# docs-publish, on pushes to main: writes this repository's layer only. Octomaton refuses any run that names it unless
# the run's branch is main.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docs-publisher
  annotations:
    octomaton.dev/branches: main
automountServiceAccountToken: false
