apiVersion: apps/v1
kind: Deployment
metadata:
  name: switchboard
  namespace: switchboard
  labels:
    app.kubernetes.io/name: switchboard
  annotations:
    # Restart when the ConfigMap or the GitHub Secret changes.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: switchboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: switchboard
    spec:
      serviceAccountName: switchboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: switchboard
          image: me-west1-docker.pkg.dev/arikkfir/images/switchboard:v0.1.0
          args:
            - --config=/etc/switchboard/config.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # /etc/switchboard/config.yaml and /etc/switchboard/github/{app-id,private-key,webhook-secret}
            - name: config
              mountPath: /etc/switchboard
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          projected:
            defaultMode: 288  # 0440
            sources:
              - configMap:
                  name: switchboard
                  items:
                    - key: config.yaml
                      path: config.yaml
              - secret:
                  name: switchboard-github
                  items:
                    - key: app-id
                      path: github/app-id
                    - key: private-key
                      path: github/private-key
                    - key: webhook-secret
                      path: github/webhook-secret
        - name: tmp
          emptyDir: {}
