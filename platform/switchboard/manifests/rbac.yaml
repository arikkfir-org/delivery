# Cluster-wide: watch runs everywhere and look up tenant namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: switchboard
  labels:
    app.kubernetes.io/name: switchboard
rules:
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
      - taskruns
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: switchboard
  labels:
    app.kubernetes.io/name: switchboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: switchboard
subjects:
  - kind: ServiceAccount
    name: switchboard
    namespace: switchboard
---
# Leader election for the check-run reconciler.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: switchboard
  namespace: switchboard
  labels:
    app.kubernetes.io/name: switchboard
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: switchboard
  namespace: switchboard
  labels:
    app.kubernetes.io/name: switchboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: switchboard
subjects:
  - kind: ServiceAccount
    name: switchboard
    namespace: switchboard
---
# What Switchboard may do inside a tenant namespace. Bound per namespace by RoleBinding "switchboard" (see ci-tenants).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: switchboard-tenant
  labels:
    app.kubernetes.io/name: switchboard
rules:
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - update
      - delete
  - apiGroups:
      - tekton.dev
    resources:
      - taskruns
    verbs:
      - get
      - list
      - watch
  # Installation-token Secrets, created before each run and re-minted by the token refresher.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - patch
      - update
      - delete
  # Workspace volumes of finished runs are freed after retention.freePVCsAfter.
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
