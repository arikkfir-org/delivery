apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: switchboard-github
  namespace: switchboard
  labels:
    app.kubernetes.io/name: switchboard
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: switchboard-github
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: switchboard-github-app-id
    - secretKey: private-key
      remoteRef:
        key: switchboard-github-private-key
    - secretKey: webhook-secret
      remoteRef:
        key: switchboard-github-webhook-secret
