# The GitHub App's webhook is the only public path; deliveries are verified with the webhook secret (HMAC).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: switchboard
  namespace: switchboard
  labels:
    app.kubernetes.io/name: switchboard
spec:
  parentRefs:
    - name: public
      namespace: traefik
  hostnames:
    - switchboard.kfirs.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - name: switchboard
          port: 80
