# The tests site, behind the protected gateway's OIDC interceptor.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tests
  namespace: tests
  labels:
    app.kubernetes.io/name: tests
spec:
  parentRefs:
    - name: protected
      namespace: traefik
  hostnames:
    - tests.dev.kfirs.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: admins
      backendRefs:
        - name: tests
          port: 80
