# On the public gateway, without the hub's sign-in: the go command fetches import pages anonymously. They tell only
# where a repository is; reading a private one (fin) still takes access to it. Each host name attaches to the listener
# whose hostname covers it: *.kfirs.com's public-websecure, and octomaton.dev's and cobranch.dev's own. On octomaton.dev,
# Octomaton's route keeps the exact path /github/hooks, which takes precedence over this prefix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-import
  namespace: go-import
  labels:
    app.kubernetes.io/name: go-import
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: public-websecure
    - name: public
      namespace: traefik
      sectionName: octomaton-dev
    - name: public
      namespace: traefik
      sectionName: cobranch-dev
  hostnames:
    - fin.kfirs.com
    - octomaton.dev
    - cobranch.dev
  rules:
    - backendRefs:
        - name: go-import
          port: 80
