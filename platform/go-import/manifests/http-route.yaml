# On the public gateway, without the hub's sign-in: the go command fetches the import page anonymously. It tells only
# where fin's repository is; reading that still takes access to the repository.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-import
  namespace: go-import
  labels:
    app.kubernetes.io/name: go-import
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: public-websecure
  hostnames:
    - fin.kfirs.com
  rules:
    - backendRefs:
        - name: go-import
          port: 80
