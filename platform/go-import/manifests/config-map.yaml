apiVersion: v1
kind: ConfigMap
metadata:
  name: go-import
  namespace: go-import
  labels:
    app.kubernetes.io/name: go-import
data:
  # Replaces the image's Caddyfile. The go command resolves a module path such as fin.kfirs.com/apps/api by fetching
  # https://fin.kfirs.com/apps/api?go-get=1 and reading its go-import meta tag: the repository whose root is the domain.
  # Every other request is redirected to the domain's redirect URL. A new domain is a row in the map below and a host
  # name in route go-import.
  Caddyfile: |
    {
    	admin off
    	auto_https off
    	persist_config off
    }

    :8080 {
    	log
    	log_skip /healthz

    	handle /healthz {
    		respond "ok" 200
    	}

    	# One row per domain: its repository, then its redirect URL ("-" for the default row's). Any other host gets the
    	# default row: no repository, and the organization's page.
    	map {host} {repository} {redirect} {
    		fin.kfirs.com https://github.com/arikkfir-org/fin https://github.com/arikkfir-org/fin
    		octomaton.dev https://github.com/arikkfir-org/octomaton https://github.com/arikkfir-org/octomaton
    		default "" https://github.com/arikkfir-org
    	}

    	@go-get {
    		query go-get=1
    		not vars {repository} ""
    	}
    	handle @go-get {
    		header Content-Type "text/html; charset=utf-8"
    		respond `<!DOCTYPE html><meta name="go-import" content="{host} git {repository}">` 200
    	}

    	handle {
    		redir {redirect} 302
    	}
    }
