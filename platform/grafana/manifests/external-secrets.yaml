# The database's two passwords, both in wave -1 with the database. postgres (postgres.yaml) sets them on its roles
# before every start.

# Role grafana's password: generated once, in the cluster, and never rotated. Grafana signs in with it. Deleting Secret
# grafana-db generates a new one, which Reloader rolls out to postgres and Grafana.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-db
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 8
  # Letters and digits only, so the password needs no quoting in a connection string.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-db
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-db
---
# The superuser postgres's password, which people sign in with. The owner sets it in Secret Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-admin
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: postgres-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: grafana-postgres-admin-password
