# The password of PostgreSQL user grafana on the hub instance, set by hand with the user (infra README, "PostgreSQL").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: grafana-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: grafana-db-password
