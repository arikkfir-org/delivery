# The password of PostgreSQL role grafana: postgres sets it (postgres.yaml) and Grafana signs in with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: grafana-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: grafana-db-password
