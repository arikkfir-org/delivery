# Grafana's database: PostgreSQL on its own volume, reached only by Grafana's pods. Wave -1 has it ready before Grafana
# starts. The superuser has no password: it signs in over the local socket only
# (kubectl exec -n grafana postgres-0 -- psql -U postgres).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  # Applied before every start of the server, so it must stay idempotent. It also sets grafana's password, so a new one
  # in Secret grafana-db applies on the next start.
  grafana.sql: |
    \getenv grafana_password GRAFANA_DB_PASSWORD
    SELECT 'CREATE ROLE grafana' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'grafana') \gexec
    ALTER ROLE grafana WITH LOGIN PASSWORD :'grafana_password';
    SELECT 'CREATE DATABASE grafana OWNER grafana'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'grafana') \gexec
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: grafana
  labels:
    app.kubernetes.io/name: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: grafana
  labels:
    app.kubernetes.io/name: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Restart, and so apply the migrations again, when they or grafana's password change.
    reloader.stakater.com/auto: "true"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      # The image reads POSTGRES_* variables, and Service links would add POSTGRES_PORT and others.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # The image's postgres user.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The image applies /docker-entrypoint-initdb.d only when it creates the database. This applies it before every
        # start instead, with the image's own functions (as its docker-ensure-initdb.sh does), on a server that listens
        # on its socket only: no client connects before the migrations are in.
        - name: migrate
          image: docker.io/library/postgres:18.6-trixie
          command:
            - bash
            - -c
            - |
              set -Eeuo pipefail
              source docker-entrypoint.sh
              docker_setup_env
              docker_create_db_directories
              if [ -z "$DATABASE_ALREADY_EXISTS" ]; then
                docker_error_old_databases
                # Without POSTGRES_PASSWORD the superuser gets no password, so the image's check for one is skipped.
                docker_init_database_dir
                pg_setup_hba_conf postgres
              fi
              docker_temp_server_start postgres
              docker_process_init_files /docker-entrypoint-initdb.d/*
              docker_temp_server_stop
          env:
            - name: GRAFANA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: migrations
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-trixie
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - pg_isready
                - --host=127.0.0.1
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - --host=127.0.0.1
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migrations
          configMap:
            name: postgres
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
# Only Grafana's pods reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: grafana
      ports:
        - protocol: TCP
          port: 5432
