# Users arrive through the protected gateway; Grafana trusts the X-Auth-Request-Email header set by the interceptor.

# Workload Identity principal grafana/grafana has roles/monitoring.viewer on the project.
serviceAccount:
  create: true
  name: grafana

env:
  # With the login form and basic auth off, the built-in admin account cannot be used; skipping it also stops the chart
  # from rendering a random admin password, which would change on every Argo CD render and restart Grafana.
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"

grafana.ini:
  server:
    domain: grafana.dev.kfirs.com
    root_url: https://grafana.dev.kfirs.com
  auth:
    disable_login_form: true
    # Grafana's own sign-out alone leaves the hub session, which signs the person straight back in. oauth2-proxy's
    # sign-out ends it, Keycloak's included, and returns to Grafana, whose next page shows Keycloak's login page.
    signout_redirect_url: https://auth.kfirs.com/oauth2/sign_out?rd=https://grafana.dev.kfirs.com/
  auth.basic:
    enabled: false
  auth.proxy:
    enabled: true
    header_name: X-Auth-Request-Email
    header_property: email
    auto_sign_up: true
  users:
    allow_sign_up: false
    auto_assign_org: true
    auto_assign_org_role: Admin
  database:
    type: postgres
    host: postgres.grafana.svc.cluster.local:5432
    name: grafana
    user: grafana
    # Plain TCP inside the namespace: NetworkPolicy postgres admits only Grafana's pods.
    ssl_mode: disable
  unified_alerting:
    ha_peers: grafana-headless.grafana.svc.cluster.local:9094
    ha_listen_address: ${POD_IP}:9094
    ha_advertise_address: ${POD_IP}:9094

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Google Cloud Monitoring
        uid: google-cloud-monitoring
        type: stackdriver
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          # GCE authentication uses the metadata server, i.e. this pod's Workload Identity.
          authenticationType: gce
          defaultProject: arikkfir

# State lives in PostgreSQL (StatefulSet postgres in manifests/), shared by both replicas, so pods keep nothing and roll
# one at a time. Password: Secret grafana-db (ExternalSecret in manifests/).
persistence:
  enabled: false

replicas: 2
podDisruptionBudget:
  maxUnavailable: 1
# A rollout starts a new replica before it stops an old one.
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
# What each replica uses, its memory limit above its peak; CPU unlimited (docs/delivery/designs/resource-requests.md).
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: grafana

envValueFrom:
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-db
      key: password
# Restart when that password changes, as postgres does to apply it. The chart copies these annotations onto its other
# objects too, where Reloader ignores them.
annotations:
  secret.reloader.stakater.com/reload: grafana-db

# The replicas find each other through Service grafana-headless (port 9094) and share alert state, so each alert
# notifies once.
headlessService: true

# The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
nodeSelector:
  kfirs.com/pool: system
tolerations:
  - key: components.gke.io/gke-managed-components
    operator: Equal
    value: "true"
    effect: NoSchedule
