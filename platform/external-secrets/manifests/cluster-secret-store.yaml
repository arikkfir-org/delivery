# No spec.provider.gcpsm.auth: the controller uses its own ambient credentials, i.e. the Workload Identity of KSA
# external-secrets/external-secrets. Wave 1 waits for the External Secrets webhook.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    gcpsm:
      projectID: arikkfir
  # Every namespace but a pull request's: Fin and Cobranch deploy pull requests' code, whose namespaces are labelled
  # kfirs.com/pull-request (platform/fin) or kfirs.com/cobranch-pull-request (platform/cobranch);
  # kfirs.com/devhub-pull-request is Cobranch's old label, kept until its last preview is gone. A namespace matching
  # any condition may use the store.
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kfirs.com/pull-request
            operator: DoesNotExist
          - key: kfirs.com/cobranch-pull-request
            operator: DoesNotExist
          - key: kfirs.com/devhub-pull-request
            operator: DoesNotExist
