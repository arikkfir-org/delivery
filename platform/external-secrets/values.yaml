installCRDs: true

# The ClusterSecretStore authenticates with this KSA's ambient Workload Identity (external-secrets/external-secrets).
serviceAccount:
  name: external-secrets

# The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
global:
  nodeSelector:
    kfirs.com/pool: system
  tolerations:
    - key: components.gke.io/gke-managed-components
      operator: Equal
      value: "true"
      effect: NoSchedule

# What each component uses, its memory limit above its peak; CPU unlimited (docs/delivery/designs/resource-requests.md).
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 256Mi
certController:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 256Mi
