installCRDs: true

# The ClusterSecretStore authenticates with this KSA's ambient Workload Identity (external-secrets/external-secrets).
serviceAccount:
  name: external-secrets

# The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
global:
  nodeSelector:
    kfirs.com/pool: system
  tolerations:
    - key: components.gke.io/gke-managed-components
      operator: Equal
      value: "true"
      effect: NoSchedule

# What each component uses, its memory limit above its peak; CPU unlimited (docs/delivery/designs/resource-requests.md).
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
# One replica each of the operator, its webhook and its cert controller. A rollout surges: the new pod is ready before
# the old one stops. A drain may evict it (docs/delivery/designs/disruption-budgets.md).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 256Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
certController:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 256Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
