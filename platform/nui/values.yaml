image:
  # The chart's appVersion is "latest"; pin a released tag (ghcr.io/nats-nui/nui).
  tag: "0.9.3"
  pullPolicy: IfNotPresent

# NUI keeps its connections and settings in /db (a volumeClaimTemplate of the chart's StatefulSet).
persistence:
  size: 1Gi

# The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
nodeSelector:
  kfirs.com/pool: system
tolerations:
  - key: components.gke.io/gke-managed-components
    operator: Equal
    value: "true"
    effect: NoSchedule
