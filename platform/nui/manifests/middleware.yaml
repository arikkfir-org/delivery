# NUI's server (fasthttp) refuses requests whose headers exceed 4 KiB, and oauth2-proxy's session cookies on .kfirs.com
# alone can exceed that. NUI has no session of its own, so its requests go without cookies; the entry point's
# ForwardAuth has already checked them.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-cookies
  namespace: nats
spec:
  headers:
    customRequestHeaders:
      Cookie: ""
---
# The hub's tools admit only group admins (docs/delivery/designs/admins-only.md): after the entry point's sign-in,
# oauth2-proxy answers 403 to a session outside the group.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admins
  namespace: nats
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth?allowed_groups=admins
    trustForwardHeader: true
