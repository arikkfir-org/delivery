# Argo CD manages itself with this file. Terraform bootstrapped the same chart (argo-cd 10.10.5, release "argocd").

global:
  domain: argocd.dev.kfirs.com
  # The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md), for every component.
  # Helm merges this selector into the chart's own (kubernetes.io/os: linux).
  nodeSelector:
    kfirs.com/pool: system
  tolerations:
    - key: components.gke.io/gke-managed-components
      operator: Equal
      value: "true"
      effect: NoSchedule
  networkPolicy:
    # The chart's argocd-server policy allows all ingress whenever this flag is on, and policies are additive, so it is
    # off here: per-component policies are enabled below, and argocd-server's policy lives in manifests/.
    create: false
  # Every Deployment rolls out by surging: the new pod is ready before the old one stops. Each component also has a
  # PodDisruptionBudget of maxUnavailable: 1 (below), which lets a drain evict a single replica, ready or not
  # (AlwaysAllow; docs/delivery/designs/disruption-budgets.md). Redis's Deployment takes no strategy; Kubernetes'
  # default surges one replica the same way.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

configs:
  cm:
    url: https://argocd.dev.kfirs.com
    oidc.config: |
      name: Keycloak
      issuer: https://id.kfirs.com/realms/hub
      clientID: hub
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
    # Restores the Application health check so app-of-apps sync waves wait for child applications to be healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # CI runs are created by Octomaton, never declared in Git; do not watch their churn.
    resourceExclusionsAdditional:
      - apiGroups:
          - tekton.dev
        kinds:
          - PipelineRun
          - TaskRun
          - CustomRun
      - apiGroups:
          - resolution.tekton.dev
        kinds:
          - ResolutionRequest
  params:
    server.insecure: true
  rbac:
    policy.default: role:admin

# Users log in through Keycloak directly (oidc.config); Dex is not needed.
dex:
  enabled: false

controller:
  networkPolicy:
    create: true
  # A StatefulSet: it replaces its pod rather than surging.
  pdb:
    enabled: true
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  # What it uses (docs/delivery/designs/resource-requests.md). Its memory is its cache of the resources it
  # manages, which grows with every pull request's Application, so the limit stays well above its peak. CPU unlimited.
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2560Mi
repoServer:
  networkPolicy:
    create: true
  pdb:
    enabled: true
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  # What each component below uses, its memory limit above its peak; CPU unlimited
  # (docs/delivery/designs/resource-requests.md). The repo server's peaks come from rendering manifests, so its limit
  # leaves the most room.
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 1Gi
redis:
  networkPolicy:
    create: true
  pdb:
    enabled: true
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 128Mi
notifications:
  networkPolicy:
    create: true
  pdb:
    enabled: true
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  # The chart's Recreate stops it before its replacement starts. It takes no lease, so two can run for the moment both
  # are up and a notification could go twice; none is configured.
  deploymentStrategy:
    type: RollingUpdate
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
applicationSet:
  pdb:
    enabled: true
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
server:
  networkPolicy:
    # Replaced by manifests/network-policy.yaml (same name, so it also adopts the policy the bootstrap created).
    create: false
  pdb:
    enabled: true
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 256Mi
