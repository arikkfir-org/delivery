apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # This route has no status until Traefik (a later sync wave) exists. Leaving it out of the argocd Application's
    # health keeps that application Healthy, so the root application's sync waves can proceed to install Traefik.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  parentRefs:
    - name: protected
      namespace: traefik
  hostnames:
    - argocd.kfirs.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
