# Hands Argo CD the signed-in user's ID token, which Argo CD verifies against Keycloak (oidc.config, same client), so
# the Keycloak session signs the user in. Only Argo CD's route uses it: the entry point's oidc middleware copies
# identity headers alone.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: id-token
  namespace: argocd
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders:
      - Authorization
---
# The hub's tools admit only group admins (docs/delivery/designs/admins-only.md): after the entry point's sign-in,
# oauth2-proxy answers 403 to a session outside the group.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admins
  namespace: argocd
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth?allowed_groups=admins
    trustForwardHeader: true
---
# Argo CD's Log out ends only Argo CD's own session, which the hub's sign-in never starts (id-token above), so it fails.
# This sends it to oauth2-proxy's sign-out instead, which ends the hub session, Keycloak's included, and returns to Argo
# CD, whose next page shows Keycloak's login page.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: logout
  namespace: argocd
spec:
  redirectRegex:
    regex: ^https://argocd\.dev\.kfirs\.com/auth/logout.*
    replacement: https://auth.kfirs.com/oauth2/sign_out?rd=https://argocd.dev.kfirs.com/
