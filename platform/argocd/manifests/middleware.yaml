# Hands Argo CD the signed-in user's ID token, which Argo CD verifies against Keycloak (oidc.config, same client), so
# the Keycloak session signs the user in. Only Argo CD's route uses it: the entry point's oidc middleware copies
# identity headers alone.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: id-token
  namespace: argocd
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders:
      - Authorization
---
# The hub's tools admit only group admins (docs/delivery/designs/admins-only.md): after the entry point's sign-in,
# oauth2-proxy answers 403 to a session outside the group.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admins
  namespace: argocd
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth?allowed_groups=admins
    trustForwardHeader: true
