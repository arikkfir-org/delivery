# Chart defaults: operator, metrics API server and admission webhooks, with CRDs.
crds:
  install: true

# Fin's scraper scales through KEDA, so a node drain must not stop it: two replicas of each component,
# spread over nodes when there are several, at most one evicted at a time. KEDA keeps one operator and one metrics
# server active and the other on standby; both webhook replicas serve.
operator:
  replicaCount: 2
metricsServer:
  replicaCount: 2
webhooks:
  replicaCount: 2
# What each component uses, memory limits above their peaks. The chart's limits of one CPU, far above use, stay
# (docs/delivery/designs/resource-requests.md).
resources:
  operator:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi
  metricServer:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 128Mi
  webhooks:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi
# A rollout starts a new replica before it stops an old one.
upgradeStrategy:
  operator:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  metricsApiServer:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  webhooks:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
podDisruptionBudget:
  operator:
    maxUnavailable: 1
  metricServer:
    maxUnavailable: 1
  webhooks:
    maxUnavailable: 1
topologySpreadConstraints:
  operator:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: keda-operator
  metricsServer:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: keda-operator-metrics-apiserver
  webhooks:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: keda-admission-webhooks

# The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
nodeSelector:
  kfirs.com/pool: system
tolerations:
  - key: components.gke.io/gke-managed-components
    operator: Equal
    value: "true"
    effect: NoSchedule
