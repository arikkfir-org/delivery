# Chart defaults: operator, metrics API server and admission webhooks, with CRDs.
crds:
  install: true

# Nothing scales through KEDA yet. Once something does, a node drain must not stop it: two replicas of each component,
# spread over nodes when there are several, at most one evicted at a time. KEDA keeps one operator and one metrics
# server active and the other on standby; both webhook replicas serve.
operator:
  replicaCount: 2
metricsServer:
  replicaCount: 2
webhooks:
  replicaCount: 2
podDisruptionBudget:
  operator:
    maxUnavailable: 1
  metricServer:
    maxUnavailable: 1
  webhooks:
    maxUnavailable: 1
topologySpreadConstraints:
  operator:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: keda-operator
  metricsServer:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: keda-operator-metrics-apiserver
  webhooks:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: keda-admission-webhooks
