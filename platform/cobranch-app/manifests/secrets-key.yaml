# Cobranch's secrets key, which seals the client secrets of the identity providers its Back-office adds: generated once,
# in the cluster, and never rotated. Under Argo CD the chart can't keep a key of its own (it renders without the
# cluster), so it reads this one (secretsKey.existingSecret). Deleting Secret cobranch-secrets-key generates a new one,
# and those client secrets no longer open: an administrator enters them again. Wave -1: before the Application.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: cobranch-secrets-key
  namespace: cobranch-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 48
  digits: 12
  # Letters and digits only, so the key needs no quoting anywhere.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cobranch-secrets-key
  namespace: cobranch-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: cobranch-secrets-key
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: cobranch-secrets-key
