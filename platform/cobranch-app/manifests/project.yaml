# The project of cobranch.app. Its source, the charts that cobranch's pipeline main publishes, comes from cobranch's main,
# so every merge there changes the cluster; this holds it to namespace cobranch-app and the kinds the chart renders there: the
# servers', the Console's, the Back-office's and PostgreSQL's workloads, Services, budgets and the database's
# NetworkPolicy, the servers' ServiceAccount, the migrate Job, the maintenance CronJob and the routes, which attach only
# to Gateway traefik/cobranch-app, for its two names. Cluster-scoped, only the job controller's ClusterRoles and
# ClusterRoleBinding, by name: cobranch-app-…, which policy cobranch-cluster-roles holds
# (platform/cobranch/manifests/jobs-policy.yaml, docs/delivery/designs/cobranch-jobs.md); namespace.yaml holds the
# Namespace. No Secrets (postgresql-password.yaml, secrets-key.yaml and google-secret.yaml hold them). Wave -1: before
# the Application that names it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cobranch-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: cobranch.app, Cobranch's hosted service, from cobranch's main.
  sourceRepos:
    - oci://me-west1-docker.pkg.dev/arikkfir/cobranch/charts/cobranch
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cobranch-app
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cobranch-app-*
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: cobranch-app-*
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
