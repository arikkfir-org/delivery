# The project of cobranch.app. Its source, chart/cobranch in arikkfir-org/cobranch, comes from cobranch's main, so every
# merge there changes the cluster; this holds it to namespace cobranch-app and the kinds the chart renders there: the
# servers', the Console's, the Back-office's and PostgreSQL's workloads, Services, budgets and the database's
# NetworkPolicy, the servers' ServiceAccount, the migrate Job, the maintenance CronJob and the routes, which attach only
# to Gateway traefik/cobranch-app, for its two names. No cluster-scoped kinds (namespace.yaml holds the Namespace), no
# Secrets (postgresql-password.yaml, secrets-key.yaml and google-secret.yaml hold them). Wave -1: before the
# Application that names it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cobranch-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: cobranch.app, Cobranch's hosted service, from cobranch's main.
  sourceRepos:
    - https://github.com/arikkfir-org/cobranch
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cobranch-app
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
