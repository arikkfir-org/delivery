# Only Traefik reaches the Console, the Back-office and the servers (the routes' backends), the Git server included. The
# chart's own policy admits only the servers, the push worker, the migrate Job and maintenance to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cobranch
  namespace: cobranch-app
  labels:
    app.kubernetes.io/name: cobranch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cobranch
      app.kubernetes.io/instance: cobranch
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [console, back-office, rest-server, graphql-server, auth-server, admin-server, git-server]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
# Only the REST and GraphQL servers reach the Git server's internal port, which no route names: their reads of trees and
# files (https://docs.dev.kfirs.com/cobranch/designs/code-browsing.md, "The internal call"). As the previews'.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cobranch-git-internal
  namespace: cobranch-app
  labels:
    app.kubernetes.io/name: cobranch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cobranch
      app.kubernetes.io/instance: cobranch
      app.kubernetes.io/component: git-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cobranch
              app.kubernetes.io/instance: cobranch
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [rest-server, graphql-server]
      ports:
        - protocol: TCP
          port: 8081
---
# Only Managed Service for Prometheus's collectors (namespace gmp-system) reach the servers' and the push worker's
# metrics port, for PodMonitoring cobranch (pod-monitoring.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cobranch-metrics
  namespace: cobranch-app
  labels:
    app.kubernetes.io/name: cobranch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cobranch
      app.kubernetes.io/instance: cobranch
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [rest-server, graphql-server, auth-server, admin-server, git-server, push-worker]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - protocol: TCP
          port: 9464
---
# Cobranch's job pods reach the REST, GraphQL and Git servers: their API calls and checkouts, which the chart's egress
# rule sends to those pods alone. Only cobranch.app's job namespaces carry its installation label, as policy
# cobranch-job-controllers holds (docs/delivery/designs/cobranch-jobs.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cobranch-jobs
  namespace: cobranch-app
  labels:
    app.kubernetes.io/name: cobranch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cobranch
      app.kubernetes.io/instance: cobranch
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [rest-server, graphql-server, git-server]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              cobranch.dev/installation: cobranch-app-cobranch
      ports:
        - protocol: TCP
          port: 8080
