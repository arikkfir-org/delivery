# Only Traefik reaches the Console, the Back-office and the servers (the routes' backends), the Git server included. The
# chart's own policy admits only the servers, the push worker, the migrate Job and maintenance to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cobranch
  namespace: cobranch-app
  labels:
    app.kubernetes.io/name: cobranch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cobranch
      app.kubernetes.io/instance: cobranch
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [console, back-office, rest-server, graphql-server, auth-server, admin-server, git-server]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
# Only the REST and GraphQL servers reach the Git server's internal port, which no route names: their reads of trees and
# files (https://docs.dev.kfirs.com/cobranch/designs/code-browsing.md, "The internal call"). As the previews'.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cobranch-git-internal
  namespace: cobranch-app
  labels:
    app.kubernetes.io/name: cobranch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cobranch
      app.kubernetes.io/instance: cobranch
      app.kubernetes.io/component: git-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cobranch
              app.kubernetes.io/instance: cobranch
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [rest-server, graphql-server]
      ports:
        - protocol: TCP
          port: 8081
