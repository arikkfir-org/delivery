# cobranch.app's nightly backup: the database, dumped in pg_dump's custom format (compressed, restored with
# pg_restore), uploaded to infra's bucket arikkfir-cobranch-app-backups, which deletes each dump after 30 days. The
# bucket's objects, the Git packs, need none: Cloud Storage keeps a deleted object for 7 days. Two containers: the dump
# in PostgreSQL's own image, the chart's, then the upload (upload-backup.sh) in curl's, as ServiceAccount
# cobranch-backup, whose only grant creates objects in that bucket. NetworkPolicy cobranch-backup admits it to the
# database. Restoring is the owner's, by hand (docs/delivery/designs/cobranch-app.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cobranch-backup
  namespace: cobranch-app
  labels:
    app.kubernetes.io/name: cobranch-backup
# GKE's metadata server gives the pod its Google token by this ServiceAccount's name; it calls no Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cobranch-backup
  namespace: cobranch-app
  labels:
    app.kubernetes.io/name: cobranch-backup
spec:
  schedule: "17 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cobranch-backup
        spec:
          serviceAccountName: cobranch-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          # The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
          initContainers:
            - name: dump
              # The chart's PostgreSQL image, so pg_dump matches the server.
              image: docker.io/library/postgres:18.6-alpine
              command: [pg_dump, --format=custom, --no-owner, --file=/backup/cobranch.dump]
              env:
                - name: PGHOST
                  value: cobranch-postgresql
                - name: PGDATABASE
                  value: cobranch
                - name: PGUSER
                  value: cobranch
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cobranch-postgresql-password
                      key: password
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: docker.io/curlimages/curl:8.22.0
              command: [/bin/sh, /scripts/upload-backup.sh]
              env:
                - name: BUCKET
                  value: arikkfir-cobranch-app-backups
                - name: BACKUP_FILE
                  value: /backup/cobranch.dump
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 4Gi
            - name: scripts
              configMap:
                name: cobranch-backup
