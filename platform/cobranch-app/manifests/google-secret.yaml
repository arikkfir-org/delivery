# The secret of the Google OAuth client that cobranch.app signs people in with, which the owner made by hand and added
# to Secret Manager (infra's cobranch-app-google-client-secret). Only the Auth server reads the Secret (the chart's
# auth.providers). Wave -1: before the Application.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cobranch-google
  namespace: cobranch-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: cobranch-google
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: cobranch-app-google-client-secret
