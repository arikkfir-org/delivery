# Nothing reaches cobranch.app but through Gateway traefik/cobranch-app: none of the Services in namespace cobranch-app,
# which the chart writes from Cobranch's main, may face beyond the cluster or take other workloads' traffic through
# external IPs. Matched by the namespace's name. Wave -1: in force before the chart's first sync.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cobranch-app-cluster-ip-services
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - services
  matchConditions:
    - name: cobranch-app
      expression: "request.namespace == 'cobranch-app'"
    # Deleting an object, the garbage collector drops its finalizer with an update that leaves the spec as it was; that
    # update passes, so an object made before this policy last tightened still goes. Every other update is checked.
    - name: changed
      expression: >-
        request.operation == 'CREATE' || !has(oldObject.metadata.deletionTimestamp) || object.spec != oldObject.spec
  validations:
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: A Service in namespace cobranch-app is of type ClusterIP.
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: A Service in namespace cobranch-app has no external IPs.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cobranch-app-cluster-ip-services
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: cobranch-app-cluster-ip-services
  validationActions:
    - Deny
