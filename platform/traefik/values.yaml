# One Traefik with two entry-point pairs, each behind its own regional external passthrough NLB:
#   protected: web (8000 -> 80, redirect) + websecure (8443 -> 443), Service "traefik",        IP "ingress-protected"
#   public:    public-web (9080 -> 80, redirect) + public-websecure (9443 -> 443), Service "traefik-public", IP "ingress-public"
# The Gateways (manifests/gateways.yaml) bind to entry points by port: protected -> 8443, public -> 9443.

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
    statusAddress:
      service:
        # The address is copied to every Gateway, and would give the public Gateway the protected load balancer's IP.
        enabled: false

# Gateways are defined in manifests/; only the GatewayClass comes from the chart.
gateway:
  enabled: false
gatewayClass:
  enabled: true
  name: traefik

# The Ingress provider is off, so an IngressClass would only mislead.
ingressClass:
  enabled: false

ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true
    http:
      middlewares:
        - traefik-strip-auth-headers@kubernetescrd
        - traefik-oidc@kubernetescrd
      tls:
        enabled: true
  public-web:
    port: 9080
    exposedPort: 80
    protocol: TCP
    expose:
      default: false
      public: true
    http:
      redirections:
        entryPoint:
          to: public-websecure
          scheme: https
          permanent: true
  public-websecure:
    port: 9443
    exposedPort: 443
    protocol: TCP
    expose:
      default: false
      public: true
    http:
      middlewares:
        - traefik-strip-auth-headers@kubernetescrd
      tls:
        enabled: true

# Backend service-based regional external passthrough NLBs on the static IPs reserved by Terraform, referenced by name.
# GKE documents the IP-name annotation for external LoadBalancer Services only together with spec.loadBalancerClass
# networking.gke.io/l4-regional-external, so both Services set that class as well as the l4-rbs annotation. Below GKE
# 1.36 these load balancers need the HttpLoadBalancing add-on; infra disables it and requires GKE 1.36. The class and
# the annotation are only read when a Service is created, and the class is immutable: changing either means deleting
# and re-creating the Service.
service:
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    networking.gke.io/load-balancer-ip-addresses: ingress-protected
  spec:
    type: LoadBalancer
    loadBalancerClass: networking.gke.io/l4-regional-external
    externalTrafficPolicy: Local
  additionalServices:
    public:
      annotations:
        cloud.google.com/l4-rbs: "enabled"
        networking.gke.io/load-balancer-ip-addresses: ingress-public
      spec:
        type: LoadBalancer
        loadBalancerClass: networking.gke.io/l4-regional-external
        externalTrafficPolicy: Local

# Wildcard certificate issued by cert-manager (manifests/certificate.yaml).
tlsStore:
  default:
    defaultCertificate:
      secretName: wildcard-kfirs-com-tls

# The dashboard on the protected entry point; the websecure entry-point middlewares put it behind the interceptor, and
# Middleware admins (manifests/middlewares.yaml) admits only group admins.
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.dev.kfirs.com`)
    entryPoints:
      - websecure
    middlewares:
      - name: admins

# Every request enters through Traefik: two replicas, spread over nodes when there are several, and at most one of them
# evicted at a time (node upgrades, drains, scale-down).
deployment:
  replicas: 2
# What each replica uses, its memory limit above its peak. CPU stays unlimited: every request to the hub passes here, and
# a CPU limit would slow them even on an idle node (hub/designs/resource-requests.md in arikkfir-org/docs).
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik

# The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
nodeSelector:
  kfirs.com/pool: system
tolerations:
  - key: components.gke.io/gke-managed-components
    operator: Equal
    value: "true"
    effect: NoSchedule
