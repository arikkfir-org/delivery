# Listener ports select Traefik entry points: 8443 = websecure (protected), 9443 = public-websecure (public).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: protected
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      port: 8443
      hostname: "*.kfirs.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-kfirs-com-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: traefik
  listeners:
    - name: public-websecure
      protocol: HTTPS
      port: 9443
      hostname: "*.kfirs.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-kfirs-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kfirs.com/public-ingress: "true"
    # Octomaton's own domain: its webhook, from namespace octomaton, and its Go import page, from go-import. Only those
    # two namespaces may attach routes.
    - name: octomaton-dev
      protocol: HTTPS
      port: 9443
      hostname: octomaton.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: octomaton-dev-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kfirs.com/public-ingress: "true"
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - octomaton
                  - go-import
    # Cobranch's own domain: its Go import page, from go-import alone.
    - name: cobranch-dev
      protocol: HTTPS
      port: 9443
      hostname: cobranch.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cobranch-dev-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kfirs.com/public-ingress: "true"
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - go-import
