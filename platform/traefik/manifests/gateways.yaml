# Listener ports select Traefik entry points: 8443 = websecure (protected), 9443 = public-websecure (public).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: protected
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      port: 8443
      hostname: "*.kfirs.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-kfirs-com-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: traefik
  listeners:
    - name: public-websecure
      protocol: HTTPS
      port: 9443
      hostname: "*.kfirs.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-kfirs-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kfirs.com/public-ingress: "true"
    # Octomaton's own domain: its webhook, from namespace octomaton, and its Go import page, from go-import. Only those
    # two namespaces may attach routes.
    - name: octomaton-dev
      protocol: HTTPS
      port: 9443
      hostname: octomaton.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: octomaton-dev-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kfirs.com/public-ingress: "true"
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - octomaton
                  - go-import
    # Cobranch's own domain: its website and Go import page, from cobranch-website alone, where cobranch.app's
    # organization cobranch delivers its repository website (docs/delivery/designs/cobranch-website.md).
    - name: cobranch-dev
      protocol: HTTPS
      port: 9443
      hostname: cobranch.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cobranch-dev-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kfirs.com/public-ingress: "true"
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - cobranch-website
    # The family's website, www.kfirs.com, and the bare domain, which it redirects there: from kfirs-website alone, where
    # cobranch.app's organization kfirs delivers its repository website (docs/delivery/designs/kfirs-website.md). They
    # are more specific than public-websecure's *.kfirs.com, which would admit every labelled namespace.
    - name: kfirs-com
      protocol: HTTPS
      port: 9443
      hostname: kfirs.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: kfirs-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kfirs.com/public-ingress: "true"
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - kfirs-website
    - name: www-kfirs-com
      protocol: HTTPS
      port: 9443
      hostname: www.kfirs.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: kfirs-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kfirs.com/public-ingress: "true"
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - kfirs-website
    # Previews of the family's website, one branch at a time: from kfirs-website-preview alone, where organization kfirs
    # delivers its website's branches. The wildcard certificate covers the name.
    - name: preview-kfirs-com
      protocol: HTTPS
      port: 9443
      hostname: preview.kfirs.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-kfirs-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kfirs.com/public-ingress: "true"
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - kfirs-website-preview
