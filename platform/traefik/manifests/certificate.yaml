# Wave 1: issued before the Gateways (wave 2) reference its Secret, so their listeners resolve on first reconcile.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-kfirs-com
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: wildcard-kfirs-com-tls
  dnsNames:
    - "*.kfirs.com"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
