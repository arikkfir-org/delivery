# Entry-point middlewares (values.yaml): websecure = strip-auth-headers + oidc; public-websecure = strip-auth-headers.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oidc
  namespace: traefik
spec:
  forwardAuth:
    # oauth2-proxy answers 202 (static upstream) for a valid session, or starts the Keycloak login otherwise.
    address: http://oauth2-proxy.auth.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-auth-headers
  namespace: traefik
spec:
  headers:
    # An empty value deletes the header, so clients cannot supply their own identity headers.
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
      X-Auth-Request-Preferred-Username: ""
---
# The hub's tools admit only group admins (docs/delivery/designs/admins-only.md): after the entry point's sign-in,
# oauth2-proxy answers 403 to a session outside the group. Here for the dashboard's IngressRoute (values.yaml); every
# other tool's namespace has its own, since a route's filters name Middlewares of its own namespace only.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admins
  namespace: traefik
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth?allowed_groups=admins
    trustForwardHeader: true
