# One replica at a time may be evicted (node upgrades, drains, scale-down); the other keeps serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cobranch-site
  namespace: cobranch-site
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cobranch-site
