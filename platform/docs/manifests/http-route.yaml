# The docs site, behind the protected gateway's OIDC interceptor.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docs
  namespace: docs
  labels:
    app.kubernetes.io/name: docs
spec:
  parentRefs:
    - name: protected
      namespace: traefik
  hostnames:
    - docs.dev.kfirs.com
  rules:
    - backendRefs:
        - name: docs
          port: 80
