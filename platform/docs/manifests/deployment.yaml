apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: docs
  labels:
    app.kubernetes.io/name: docs
  annotations:
    # Restart when the nginx configuration changes.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs
      annotations:
        # GKE's Cloud Storage FUSE sidecar mounts the private arikkfir-docs bucket (read-only).
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-request: 10m
        gke-gcsfuse/memory-request: 64Mi
        gke-gcsfuse/ephemeral-storage-request: 64Mi
        gke-gcsfuse/memory-limit: 256Mi
        gke-gcsfuse/ephemeral-storage-limit: 1Gi
    spec:
      serviceAccountName: docs
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.30.5-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: site
              mountPath: /srv/site
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: site
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: arikkfir-docs
              # The publish pipeline uploads objects without directory placeholders.
              mountOptions: implicit-dirs
        - name: config
          configMap:
            name: docs
        - name: tmp
          emptyDir: {}
