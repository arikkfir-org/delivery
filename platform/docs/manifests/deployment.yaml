apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: docs
  labels:
    app.kubernetes.io/name: docs
  annotations:
    # Restart when the Caddy configuration changes.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs
      annotations:
        # GKE's Cloud Storage FUSE sidecar mounts the private arikkfir-docs bucket (read-only).
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-request: 10m
        gke-gcsfuse/memory-request: 64Mi
        gke-gcsfuse/ephemeral-storage-request: 64Mi
        gke-gcsfuse/memory-limit: 256Mi
        gke-gcsfuse/ephemeral-storage-limit: 1Gi
    spec:
      serviceAccountName: docs
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: docker.io/library/caddy:2.11.4-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # The image gives its caddy binary cap_net_bind_service as a file capability, and the kernel refuses to run
              # such a binary without that capability in the bounding set. Caddy still listens on 8080.
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: site
              mountPath: /srv/site
              readOnly: true
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            # The image's XDG_DATA_HOME and XDG_CONFIG_HOME.
            - name: data
              mountPath: /data
            - name: xdg-config
              mountPath: /config
      volumes:
        - name: site
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: arikkfir-docs
              # The publish pipeline uploads objects without directory placeholders.
              mountOptions: implicit-dirs
        - name: config
          configMap:
            name: docs
        - name: data
          emptyDir: {}
        - name: xdg-config
          emptyDir: {}
