apiVersion: v1
kind: ConfigMap
metadata:
  name: docs
  namespace: docs
  labels:
    app.kubernetes.io/name: docs
data:
  # Replaces the image's Caddyfile. No listings or index pages: pages are reached by direct links.
  Caddyfile: |
    {
      admin off
      auto_https off
      persist_config off
    }

    :8080 {
      root * /srv/site
      log
      log_skip /healthz

      handle /healthz {
        respond "ok" 200
      }

      # Hidden paths, such as the publish pipeline's .published-revision marker, are never served.
      @hidden path_regexp /\.
      handle @hidden {
        respond 404
      }

      # A directory is not a page.
      @directory file {path}/
      handle @directory {
        respond 404
      }

      handle {
        header Cache-Control "private, max-age=300"
        @markdown path *.md
        header @markdown Content-Type "text/markdown; charset=utf-8"
        file_server
      }
    }
