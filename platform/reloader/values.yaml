# Restarts workloads annotated with reloader.stakater.com/* when their ConfigMaps or Secrets change, in any namespace.
reloader:
  watchGlobally: true
  # One replica (it takes no lease unless enableHA). A drain may evict it (docs/delivery/designs/disruption-budgets.md).
  # Its Deployment takes no strategy; Kubernetes' default surges one replica: the new pod is ready before the old one
  # stops.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md). What it uses, its memory
  # limit above its peak; CPU unlimited (docs/delivery/designs/resource-requests.md).
  deployment:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 256Mi
    nodeSelector:
      kfirs.com/pool: system
    tolerations:
      - key: components.gke.io/gke-managed-components
        operator: Equal
        value: "true"
        effect: NoSchedule
