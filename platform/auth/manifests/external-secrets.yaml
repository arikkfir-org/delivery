apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: oidc-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: oauth2-proxy-cookie-secret
---
# Newline-separated emails allowed through the interceptor. oauth2-proxy watches the mounted file, so a shorter refresh
# makes additions take effect quickly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-emails
  namespace: auth
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: oauth2-proxy-emails
    creationPolicy: Owner
  data:
    - secretKey: emails
      remoteRef:
        key: hub-authorized-emails
