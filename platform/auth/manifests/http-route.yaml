# Only the oauth2-proxy endpoints (login callback, sign-in/out) are public; everything else is reached via ForwardAuth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  parentRefs:
    - name: public
      namespace: traefik
  hostnames:
    - auth.kfirs.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - name: oauth2-proxy
          port: 80
