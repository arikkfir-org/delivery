# oauth2-proxy is the hub's auth interceptor: Traefik's "oidc" ForwardAuth middleware calls it for every request on the
# protected entry point, and its callback is served at https://auth.kfirs.com/oauth2 through the public gateway.

config:
  # ExternalSecret "oauth2-proxy" (manifests/external-secrets.yaml): keys client-secret and cookie-secret.
  existingSecret: oauth2-proxy
  # The client ID is not secret; it is passed as a flag below.
  requiredSecretKeys:
    - client-secret
    - cookie-secret
  # Descope decides who signs in (only users of its project can), so every email it authenticates is admitted.
  emailDomains:
    - "*"
  upstreams:
    - static://202

extraArgs:
  provider: oidc
  oidc-issuer-url: https://api.descope.com/P3JyPV2qsSrMLUpVPTGcBNRHlSkv
  client-id: P3JyPV2qsSrMLUpVPTGcBNRHlSkv
  # offline_access yields a refresh token, which cookie-refresh uses to renew the session's tokens.
  scope: openid email profile offline_access
  cookie-refresh: 5m
  redirect-url: https://auth.kfirs.com/oauth2/callback
  reverse-proxy: true
  set-xauthrequest: true
  # Adds "Authorization: Bearer <ID token>" to the response; only Argo CD's descope-token middleware copies it upstream.
  set-authorization-header: true
  skip-provider-button: true
  cookie-domain: .kfirs.com
  cookie-secure: true
  whitelist-domain: .kfirs.com

# Restart when the client or cookie secret (environment variables) rotates.
deploymentAnnotations:
  reloader.stakater.com/auto: "true"

# Every protected request is authorized here. Sessions live in cookies, so replicas share nothing: two of them, spread
# over nodes when there are several, and at most one evicted at a time.
replicaCount: 2
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  minAvailable: null
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: auth
