# oauth2-proxy is the hub's auth interceptor: Traefik's "oidc" ForwardAuth middleware calls it for every request on the
# protected entry point, and its callback is served at https://auth.kfirs.com/oauth2 through the public gateway.

config:
  # ExternalSecret "oauth2-proxy" (manifests/external-secrets.yaml): keys client-secret and cookie-secret.
  existingSecret: oauth2-proxy
  # The client ID is not secret; it is passed as a flag below.
  requiredSecretKeys:
    - client-secret
    - cookie-secret
  # Keycloak decides who signs in (only the users terraform/keycloak declares), so every email it authenticates is
  # admitted.
  emailDomains:
    - "*"
  upstreams:
    - static://202

extraArgs:
  provider: oidc
  oidc-issuer-url: https://id.kfirs.com/realms/hub
  client-id: hub
  # No offline_access: Keycloak sets no SSO cookie when it is requested at first login. The refresh token that
  # cookie-refresh uses lives as long as the realm's SSO session.
  scope: openid email profile
  cookie-refresh: 5m
  redirect-url: https://auth.kfirs.com/oauth2/callback
  # Sign-out ends the Keycloak session too: oauth2-proxy calls realm hub's end-session endpoint itself, with the
  # session's ID token, which names the session. Without it, the next protected page signs the person straight back in.
  backend-logout-url: https://id.kfirs.com/realms/hub/protocol/openid-connect/logout?id_token_hint={id_token}
  reverse-proxy: true
  set-xauthrequest: true
  # Adds "Authorization: Bearer <ID token>" to the response; only Argo CD's id-token middleware copies it upstream.
  set-authorization-header: true
  skip-provider-button: true
  cookie-domain: .kfirs.com
  cookie-secure: true
  whitelist-domain: .kfirs.com

# Restart when the client or cookie secret (environment variables) rotates.
deploymentAnnotations:
  reloader.stakater.com/auto: "true"

# Every protected request is authorized here. Sessions live in cookies, so replicas share nothing: two of them, spread
# over nodes when there are several, and at most one evicted at a time. A rollout starts a new replica before it stops
# an old one.
replicaCount: 2
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  minAvailable: null
# What each replica uses; CPU unlimited (docs/delivery/designs/resource-requests.md). Every protected request waits on
# it, so its memory limit leaves more room above its peak than its use alone would ask for.
resources:
  requests:
    cpu: 40m
    memory: 16Mi
  limits:
    memory: 128Mi
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: auth

# The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
nodeSelector:
  kfirs.com/pool: system
tolerations:
  - key: components.gke.io/gke-managed-components
    operator: Equal
    value: "true"
    effect: NoSchedule
