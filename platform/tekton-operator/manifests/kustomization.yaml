apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Tekton publishes releases here since v0.78; the storage.googleapis.com bucket stops at v0.77.0.
  - https://infra.tekton.dev/tekton-releases/operator/previous/v0.81.1/release.yaml
  - pod-disruption-budgets.yaml
patches:
  # The TektonConfig "config" is declared in platform/tekton; stop the operator from creating a default one first
  # (which would briefly install components the hub does not use, such as Results and Chains).
  - target:
      version: v1
      kind: ConfigMap
      name: tekton-config-defaults
      namespace: tekton-operator
    patch: |-
      - op: replace
        path: /data/AUTOINSTALL_COMPONENTS
        value: "false"
  # The operator and its webhook on the system node pool, beside GKE's own components
  # (docs/delivery/designs/node-pools.md). TektonConfig's spec.config places what the operator installs. Both roll out
  # by surging: the new pod is ready before the old one stops (docs/delivery/designs/disruption-budgets.md).
  - target:
      kind: Deployment
      namespace: tekton-operator
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kfirs.com/pool: system
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: components.gke.io/gke-managed-components
            operator: Equal
            value: "true"
            effect: NoSchedule
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
  # What each container uses, its memory limit above its peak; CPU unlimited
  # (docs/delivery/designs/resource-requests.md).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tekton-operator
        namespace: tekton-operator
      spec:
        template:
          spec:
            containers:
              - name: tekton-operator-lifecycle
                resources:
                  requests:
                    cpu: 10m
                    memory: 96Mi
                  limits:
                    memory: 512Mi
              - name: tekton-operator-cluster-operations
                resources:
                  requests:
                    cpu: 10m
                    memory: 48Mi
                  limits:
                    memory: 256Mi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tekton-operator-webhook
        namespace: tekton-operator
      spec:
        template:
          spec:
            containers:
              - name: tekton-operator-webhook
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 128Mi
