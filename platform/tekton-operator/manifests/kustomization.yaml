apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Tekton publishes releases here since v0.78; the storage.googleapis.com bucket stops at v0.77.0.
  - https://infra.tekton.dev/tekton-releases/operator/previous/v0.81.1/release.yaml
patches:
  # The TektonConfig "config" is declared in platform/tekton; stop the operator from creating a default one first
  # (which would briefly install components the hub does not use, such as Results and Chains).
  - target:
      version: v1
      kind: ConfigMap
      name: tekton-config-defaults
      namespace: tekton-operator
    patch: |-
      - op: replace
        path: /data/AUTOINSTALL_COMPONENTS
        value: "false"
  # The operator and its webhook on the system node pool, beside GKE's own components
  # (docs/delivery/designs/node-pools.md). TektonConfig's spec.config places what the operator installs.
  - target:
      kind: Deployment
      namespace: tekton-operator
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kfirs.com/pool: system
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: components.gke.io/gke-managed-components
            operator: Equal
            value: "true"
            effect: NoSchedule
