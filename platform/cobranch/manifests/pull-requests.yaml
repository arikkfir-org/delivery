# A Cobranch of every open pull request that cobranch's members open, whatever its base branch: namespace
# cobranch-pr-<number>, at https://pr-<number>.cobranch.dev.kfirs.com, the APIs under /api and /graphql, through
# the shared Gateway traefik/cobranch-pull-requests (pull-requests-gateway.yaml), running the pull request's head commit,
# seeded afresh with demo data at every push (docs/delivery/designs/cobranch-previews.md). The generator lists cobranch's pull requests through
# Argo CD's GitHub App (Secret github-app, platform/argocd) every minute; when a pull request closes or merges, its
# Application goes and the resources finalizer deletes the preview, namespace and database included. It
# names the preview from the pull request's number and the commit from its head SHA, never from a title; the template
# uses those alone. Three sources: the chart from the head commit, and what the hub decides around it from delivery's
# main (platform/cobranch/pull-request, which holds the Namespace, so no CreateNamespace, and, for each head commit,
# platform/cobranch/pull-request-commit). A preview is configured as cobranch.app is
# (platform/cobranch-app/manifests/cobranch.yaml), but for what the design lists under "What differs from cobranch.app",
# each with the owner's reason: a value cobranch.app gains comes here in the same pull request.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cobranch-pull-requests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - pullRequest:
        github:
          owner: arikkfir-org
          repo: cobranch
          appSecretName: github-app
        requeueAfterSeconds: 60
        values:
          env: "pr-{{ .number }}"
          revision: "{{ .head_sha }}"
          # The images' tag, as cobranch's pipeline preview writes it: the commit's first seven characters.
          tag: "{{ trunc 7 .head_sha }}"
      # cobranch is public: GitHub lists forks' pull requests among cobranch's and serves their head commits from cobranch,
      # and the generator drops the repository a pull request comes from, so a fork's chart would run what it likes on
      # pool ci. Only pull requests that cobranch's members open get a preview: its owner, whose sessions open them as
      # the owner too, and Dependabot, which opens them from cobranch's own branches. A new collaborator is added here.
      selector:
        matchExpressions:
          - key: author
            operator: In
            values:
              - arikkfir
              - dependabot[bot]
  template:
    metadata:
      name: "cobranch-{{ .values.env }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cobranch-pull-requests
      destination:
        server: https://kubernetes.default.svc
        namespace: "cobranch-{{ .values.env }}"
      sources:
        - repoURL: https://github.com/arikkfir-org/cobranch
          targetRevision: "{{ .values.revision }}"
          path: chart/cobranch
          helm:
            releaseName: cobranch
            # helm test's pod is for a person or CI to run, not for every sync.
            skipTests: true
            # As strings: a short SHA can be all digits.
            parameters:
              - name: images.cobranch.tag
                value: "{{ .values.tag }}"
                forceString: true
              - name: images.console.tag
                value: "{{ .values.tag }}"
                forceString: true
              - name: images.backOffice.tag
                value: "{{ .values.tag }}"
                forceString: true
            valuesObject:
              # cobranch's pipeline preview pushes every pushed head commit's images there; only previews pull from it.
              images:
                cobranch:
                  repository: me-west1-docker.pkg.dev/arikkfir/cobranch-previews/cobranch
                console:
                  repository: me-west1-docker.pkg.dev/arikkfir/cobranch-previews/cobranch-console
                backOffice:
                  repository: me-west1-docker.pkg.dev/arikkfir/cobranch-previews/cobranch-back-office
              # One host, whose route (platform/cobranch/pull-request) strips each workload's prefix. urls.auth deploys the
              # Auth server; with no provider (no identity provider takes a wildcard host, and a preview reads no secret),
              # people sign in as the seeded users (owner, 2026-10-30). urls.git deploys the Git server, on a public host
              # of its own, and the push worker.
              urls:
                console: "https://{{ .values.env }}.cobranch.dev.kfirs.com"
                rest: "https://{{ .values.env }}.cobranch.dev.kfirs.com/api"
                graphql: "https://{{ .values.env }}.cobranch.dev.kfirs.com/graphql"
                auth: "https://{{ .values.env }}.cobranch.dev.kfirs.com/auth"
                admin: "https://{{ .values.env }}.cobranch.dev.kfirs.com/admin"
                backOffice: "https://{{ .values.env }}.cobranch.dev.kfirs.com/back-office"
                git: "https://{{ .values.env }}.git.cobranch.dev.kfirs.com"
              # The seeded demo administrator, Ada Admin: signing in as her opens the Back-office.
              auth:
                admins:
                  - ada@cobranch.example
              # The demo data a reviewer starts from (cobranch's db/seeds/).
              seed:
                enabled: true
              # Replicas and resources are the chart's, as cobranch.app's are. Every pod on pool ci, which policy
              # cobranch-node-pool holds.
              authServer:
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              restServer:
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              graphqlServer:
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              adminServer:
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              console:
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              backOffice:
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              gitServer:
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              pushWorker:
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              migrate:
                # A sync can start before pipeline preview has pushed the commit's images: the Job waits for its image within
                # this deadline, and the servers and the Console wait for the Job. A newer push ends the wait at once
                # (superseded-syncs-policy.yaml).
                activeDeadlineSeconds: 1800
                # The Job's name is a hash of its spec, so this names a new one for each Job that empties the database
                # (platform/cobranch/pull-request-commit): an emptied database is always migrated and seeded again, even for a head
                # commit whose migrate Job ran before that Job came, as every preview open when it first came had.
                podAnnotations:
                  kfirs.com/database-recreated-by: "cobranch-recreate-database-{{ .values.tag }}"
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              maintenance:
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
              # Generated in the namespace (platform/cobranch/pull-request): the chart's own would change at every render.
              secretsKey:
                existingSecret: cobranch-secrets-key
                secretKey: password
              postgresql:
                # Pinned here, as cobranch.app's: a new major can't start on the old one's data. Unlike cobranch.app's, its
                # pod lets the cluster autoscaler move it: a preview never keeps a CI node up.
                image:
                  repository: docker.io/library/postgres
                  tag: 18.6-alpine
                # Generated in the namespace (platform/cobranch/pull-request): the chart's own would change at every render.
                # The database and user, the chart's defaults, as Job cobranch-recreate-database names them: change them
                # there together.
                auth:
                  database: cobranch
                  username: cobranch
                  existingSecret: cobranch-postgresql-password
                nodeSelector:
                  kfirs.com/pool: ci
                tolerations:
                  - key: kfirs.com/pool
                    operator: Equal
                    value: ci
                    effect: NoSchedule
        - repoURL: https://github.com/arikkfir-org/delivery
          targetRevision: main
          path: platform/cobranch/pull-request
          kustomize:
            namespace: "cobranch-{{ .values.env }}"
            patches:
              - target:
                  kind: HTTPRoute
                  name: cobranch
                patch: |-
                  - op: replace
                    path: /spec/hostnames
                    value:
                      - "{{ .values.env }}.cobranch.dev.kfirs.com"
              - target:
                  kind: HTTPRoute
                  name: cobranch-git
                patch: |-
                  - op: replace
                    path: /spec/hostnames
                    value:
                      - "{{ .values.env }}.git.cobranch.dev.kfirs.com"
        # What each head commit adds (platform/cobranch/pull-request-commit): Job cobranch-recreate-database, named after the
        # commit so that it runs once for each, and every push starts from an empty database, with the commit's image to
        # wait for.
        - repoURL: https://github.com/arikkfir-org/delivery
          targetRevision: main
          path: platform/cobranch/pull-request-commit
          kustomize:
            namespace: "cobranch-{{ .values.env }}"
            images:
              - "me-west1-docker.pkg.dev/arikkfir/cobranch-previews/cobranch:{{ .values.tag }}"
            patches:
              - target:
                  kind: Job
                  name: cobranch-recreate-database
                patch: |-
                  - op: replace
                    path: /metadata/name
                    value: "cobranch-recreate-database-{{ .values.tag }}"
                options:
                  allowNameChange: true
      # A StatefulSet's volume claim templates can't change: a preview keeps the database volume it started with when a
      # newer chart, or this file, sizes it otherwise, instead of failing every sync. A new preview gets the chart's.
      # A Job's spec can't change either: the head commit's Job cobranch-recreate-database keeps the spec it started with
      # when its file changes it, and the next push's Job takes the new one.
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates
        - group: batch
          kind: Job
          name: "cobranch-recreate-database-{{ .values.tag }}"
          jsonPointers:
            - /spec
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Each retry syncs the head commit again; a newer push makes a new commit, whose migrate Job has a new name.
        retry:
          limit: 2
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
