# The project of Cobranch's demo. Its source, chart/cobranch in arikkfir-org/cobranch, comes from cobranch's main, so every merge
# there changes the cluster; this holds it to namespace cobranch and the kinds the chart renders there: the servers', the
# Console's and PostgreSQL's workloads, Services, budgets and the database's NetworkPolicy, the servers' ServiceAccount
# the migrate Job and the maintenance CronJob. No cluster-scoped kinds (namespace.yaml holds the Namespace), no Secrets (the database's password
# and the secrets key are postgresql-password.yaml's and secrets-key.yaml's), no routes (http-route.yaml, git-http-route.yaml).
# Wave -1: before the Application that names it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cobranch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cobranch's demo, from cobranch's main.
  sourceRepos:
    - https://github.com/arikkfir-org/cobranch
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cobranch
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
