# The demo's Git server at git.cobranch.dev.kfirs.com, on Gateway traefik/cobranch-git (git-gateway.yaml): public, with
# no Middleware, since Git clients can't pass the hub's sign-in. The Git server answers 401 to a request without a
# personal token and 404 to one whose token can't read the repository. It serves at /, as the chart's urls.git says.
# Wave 2, after the Gateway (wave 1): Argo CD waits for a route to be accepted before the next wave, and only an
# existing Gateway accepts it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cobranch-git
  namespace: cobranch
  labels:
    app.kubernetes.io/name: cobranch
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik
      name: cobranch-git
      sectionName: demo
  hostnames:
    - git.cobranch.dev.kfirs.com
  rules:
    - backendRefs:
        - name: cobranch-git-server
          port: 80
