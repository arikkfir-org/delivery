# The bundled PostgreSQL's password: generated once, in the cluster, and never rotated. Under Argo CD the chart can't
# keep a password of its own (it renders without the cluster), so it reads this one (postgresql.auth.existingSecret).
# Deleting Secret cobranch-postgresql-password generates a new one, which the database, initialized with the old one,
# refuses. Wave -1: before the Application.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: cobranch-postgresql-password
  namespace: cobranch
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 8
  # Letters and digits only, so the password needs no quoting anywhere.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cobranch-postgresql-password
  namespace: cobranch
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: cobranch-postgresql-password
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: cobranch-postgresql-password
