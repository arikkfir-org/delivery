# Cobranch's previews on the hub: a Cobranch of every pull request that cobranch's members open, their shared Gateway,
# project, admission policies and ApplicationSet (docs/delivery/designs/cobranch-previews.md), and their public Git
# Gateway, traefik/cobranch-git; what each preview holds beside the chart is platform/cobranch/pull-request. The demo
# that ran here from cobranch's main gave way to cobranch.app (platform/cobranch-app, docs/delivery/designs/cobranch.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pull-requests-project.yaml
  - namespaces-policy.yaml
  - services-policy.yaml
  - http-routes-policy.yaml
  - middlewares-policy.yaml
  - external-secrets-policy.yaml
  - disruption-budgets-policy.yaml
  - node-pool-policy.yaml
  - cron-jobs-policy.yaml
  - superseded-syncs-policy.yaml
  - pull-requests-gateway.yaml
  - git-gateway.yaml
  - pull-requests.yaml
