# The secret of Keycloak client cobranch, which infra's root keycloak generates and writes to Secret Manager
# (keycloak-cobranch-client-secret). Only the demo's Auth server reads the Secret (the chart's auth.providers). Wave -1:
# before the Application.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cobranch-keycloak
  namespace: cobranch
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: cobranch-keycloak
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: keycloak-cobranch-client-secret
