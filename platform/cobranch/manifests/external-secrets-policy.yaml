# ClusterSecretStore gcp-secret-manager refuses namespaces labelled kfirs.com/cobranch-pull-request already; on top of
# that, an ExternalSecret in a Cobranch preview takes its data only from generators, such as its PostgreSQL password's,
# and names no store. Matched by the namespace's name. Wave -1: in force before any preview.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cobranch-external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - external-secrets.io
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - externalsecrets
  matchConditions:
    - name: preview
      expression: "request.namespace.startsWith('cobranch-pr-')"
    # Deleting an object, the garbage collector drops its finalizer with an update that leaves the spec as it was; that
    # update passes, so an object made before this policy last tightened still goes. Every other update is checked.
    - name: changed
      expression: >-
        request.operation == 'CREATE' || !has(oldObject.metadata.deletionTimestamp) || object.spec != oldObject.spec
  validations:
    - expression: >-
        !has(object.spec.secretStoreRef)
        && (!has(object.spec.data) || size(object.spec.data) == 0)
        && has(object.spec.dataFrom)
        && object.spec.dataFrom.all(d, has(d.sourceRef) && has(d.sourceRef.generatorRef)
          && !has(d.extract) && !has(d.find))
      message: An ExternalSecret in a Cobranch preview takes its data from generators only, and names no secret store.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cobranch-external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: cobranch-external-secrets
  validationActions:
    - Deny
