# Nothing reaches a Cobranch preview but through Gateway traefik/cobranch-pull-requests: none of its Services may face beyond
# the cluster, or take other workloads' traffic through external IPs. Matched by the namespace's name, which a pull
# request's code can't change. Wave -1: in force before any preview.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cobranch-cluster-ip-services
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - services
  matchConditions:
    - name: preview
      expression: "request.namespace.startsWith('cobranch-pr-')"
    # Deleting an object, the garbage collector drops its finalizer with an update that leaves the spec as it was; that
    # update passes, so an object made before this policy last tightened still goes. Every other update is checked.
    - name: changed
      expression: >-
        request.operation == 'CREATE' || !has(oldObject.metadata.deletionTimestamp) || object.spec != oldObject.spec
  validations:
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: A Service in a Cobranch preview is of type ClusterIP.
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: A Service in a Cobranch preview has no external IPs.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cobranch-cluster-ip-services
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: cobranch-cluster-ip-services
  validationActions:
    - Deny
