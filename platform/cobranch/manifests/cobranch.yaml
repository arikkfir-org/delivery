# Cobranch's demo, namespace cobranch, at cobranch.dev.kfirs.com. Its chart lives with its code, in chart/cobranch of
# arikkfir-org/cobranch. Argo CD follows cobranch's main and runs the images of the synced commit, which cobranch's
# pipeline main publishes for main's newest commit, tagged with its short SHA. Each sync migrates the database first (the
# chart's migrate Job, ordered by its sync waves). No CreateNamespace: namespace.yaml holds it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cobranch
  namespace: argocd
spec:
  project: cobranch
  destination:
    server: https://kubernetes.default.svc
    namespace: cobranch
  source:
    repoURL: https://github.com/arikkfir-org/cobranch
    targetRevision: main
    path: chart/cobranch
    helm:
      releaseName: cobranch
      # helm test's pod is for a person or CI to run, not for every sync.
      skipTests: true
      # The synced commit's images. As strings: a short SHA can be all digits.
      parameters:
        - name: images.cobranch.tag
          value: ${ARGOCD_APP_REVISION_SHORT}
          forceString: true
        - name: images.console.tag
          value: ${ARGOCD_APP_REVISION_SHORT}
          forceString: true
      valuesObject:
        images:
          cobranch:
            repository: me-west1-docker.pkg.dev/arikkfir/cobranch/cobranch
          console:
            repository: me-west1-docker.pkg.dev/arikkfir/cobranch/cobranch-console
        # One host behind the protected gateway's sign-in, whose routes (http-route.yaml) strip each API's prefix.
        urls:
          console: https://cobranch.dev.kfirs.com
          rest: https://cobranch.dev.kfirs.com/api
          graphql: https://cobranch.dev.kfirs.com/graphql
          auth: https://cobranch.dev.kfirs.com/auth
        # Sign-in through the hub's Keycloak, realm hub, as client cobranch (infra's root keycloak): the hub's own
        # Google sign-in, for the people the realm declares. The client's secret comes from keycloak-secret.yaml. The
        # owner is the installation's administrator.
        auth:
          providers:
            - id: hub
              name: Kfirs hub
              issuer: https://id.kfirs.com/realms/hub
              clientId: cobranch
              clientSecret:
                secretName: cobranch-keycloak
                key: client-secret
          admins:
            - arikkfir@gmail.com
        # infra's bucket, which only the servers' ServiceAccount, cobranch-server, reaches through Workload Identity.
        blob:
          url: gs://arikkfir-cobranch
        # Every pod on the system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
        authServer:
          # Reloader restarts the Auth server when Secret cobranch-keycloak changes, so a rotated client secret takes
          # effect without a hand.
          podAnnotations:
            reloader.stakater.com/auto: "true"
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
        restServer:
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
        graphqlServer:
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
        console:
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
        migrate:
          # A sync can start before main's pipeline has published the commit's images. The migrate Job, the chart's
          # first wave after PostgreSQL, then waits for its image (pulls back off to five minutes apart) within this
          # deadline, and the servers and the Console wait for it.
          activeDeadlineSeconds: 1800
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
        maintenance:
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
        postgresql:
          # Generated once in the cluster (postgresql-password.yaml): the chart's own would change at every render.
          auth:
            existingSecret: cobranch-postgresql-password
          nodeSelector:
            kfirs.com/pool: system
          tolerations:
            - key: components.gke.io/gke-managed-components
              operator: Equal
              value: "true"
              effect: NoSchedule
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Each retry syncs main's newest commit. One whose migrate Job failed fails again (the Job is named by a hash of
    # its spec, so it is the same failed Job); a newer commit's Job has a new name.
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
