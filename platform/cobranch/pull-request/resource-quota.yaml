# What a preview may take from pool ci, whatever its pull request's chart asks for: the chart's replicas and resources,
# as the demo runs them, while every Deployment surges one pod, the Jobs run and maintenance compacts, with room to
# spare; and its database's volume, twice the chart's size. Every container has to state its requests and memory limit
# to start, as the chart's do.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cobranch
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 4Gi
    limits.memory: 16Gi
    pods: "30"
    persistentvolumeclaims: "1"
    requests.storage: 16Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
