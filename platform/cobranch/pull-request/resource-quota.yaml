# What a preview may take from pool ci, whatever its pull request's chart asks for: about four times what one replica
# of each workload, the migrate Job and PostgreSQL request. Every container has to state its requests and memory limit
# to start, as the chart's do.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cobranch
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 4Gi
    limits.memory: 10Gi
    pods: "20"
    persistentvolumeclaims: "1"
    requests.storage: 2Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
