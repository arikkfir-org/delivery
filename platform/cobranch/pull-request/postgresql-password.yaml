# The bundled PostgreSQL's password, generated once in the namespace, as cobranch.app's: under Argo CD the chart can't keep
# a password of its own (it renders without the cluster), so it reads this one (postgresql.auth.existingSecret). The
# store gcp-secret-manager is out of the namespace's reach; a generator needs none. Wave -1: before the chart.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: cobranch-postgresql-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 8
  # Letters and digits only, so the password needs no quoting anywhere.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cobranch-postgresql-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: cobranch-postgresql-password
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: cobranch-postgresql-password
