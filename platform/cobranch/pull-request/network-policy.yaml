# Only Traefik reaches the Console, the Back-office and the servers (the routes' backends), the Git server included. The
# chart's own policy admits only the servers and the migrate Job to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cobranch
  labels:
    app.kubernetes.io/name: cobranch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cobranch
      app.kubernetes.io/instance: cobranch
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [console, back-office, rest-server, graphql-server, auth-server, admin-server, git-server]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
# Only the REST and GraphQL servers reach the Git server's internal port, which no route names: their reads of trees and
# files (https://docs.dev.kfirs.com/cobranch/designs/code-browsing.md, "The internal call").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cobranch-git-internal
  labels:
    app.kubernetes.io/name: cobranch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cobranch
      app.kubernetes.io/instance: cobranch
      app.kubernetes.io/component: git-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cobranch
              app.kubernetes.io/instance: cobranch
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [rest-server, graphql-server]
      ports:
        - protocol: TCP
          port: 8081
---
# The demo data's Job, which runs after each sync with seed.enabled, signs in at the Auth server, makes a personal token
# at the REST server and pushes the demo history to the Git server: only it reaches those three besides Traefik.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cobranch-seed
  labels:
    app.kubernetes.io/name: cobranch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cobranch
      app.kubernetes.io/instance: cobranch
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [auth-server, rest-server, git-server]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cobranch
              app.kubernetes.io/instance: cobranch
              app.kubernetes.io/component: seed
      ports:
        - protocol: TCP
          port: 8080
---
# The Job that recreates the database for each new head commit (recreate-database.yaml) reaches PostgreSQL, beside what
# the chart's own policy admits there.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cobranch-recreate-database
  labels:
    app.kubernetes.io/name: cobranch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cobranch
      app.kubernetes.io/instance: cobranch
      app.kubernetes.io/component: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cobranch
              app.kubernetes.io/instance: cobranch
              app.kubernetes.io/component: recreate-database
      ports:
        - protocol: TCP
          port: 5432
