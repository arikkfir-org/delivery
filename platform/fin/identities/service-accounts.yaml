# Workload Identity principals principal://…/subject/ns/fin/sa/<name> hold their grants
# (https://docs.dev.kfirs.com/infra/terraform/gcp.md, "IAM"). No token is mounted: GKE's metadata server answers
# for the pod's ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: fin
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  labels:
    app.kubernetes.io/part-of: fin
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scraper
  labels:
    app.kubernetes.io/part-of: fin
automountServiceAccountToken: false
