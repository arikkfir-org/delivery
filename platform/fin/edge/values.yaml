# One Fin environment's edge: its namespace and quota, its certificate, Gateway and routes on Traefik's protected entry
# point, and its database's passwords. Fin's chart (deploy/chart in arikkfir-org/fin) holds the workloads and comes
# from the environment's commit, a pull request's included, so everything that claims a host name, reads Secret
# Manager or shapes the namespace lives here, on main. The Applications that deploy it set environment and hosts.

# production, or pr-<number> for a pull request's preview.
environment: ""

hosts:
  app: ""
  api: ""

# Production keeps its namespace, and with it its database's volume, when its Applications go.
keepNamespace: false

# What the environment's pods may reserve all together. Previews ask for less.
quota:
  requests.cpu: "4"
  requests.memory: 8Gi
  limits.memory: 16Gi
  pods: "30"
  persistentvolumeclaims: "2"
  requests.storage: 100Gi
