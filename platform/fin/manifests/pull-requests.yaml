# A deployment of every open pull request of fin, whatever its base branch: namespace fin-pr-<number>, at
# pr-<number>.app.dev.fin.kfirs.com, the API under /api, through the shared Gateway traefik/fin-pull-requests
# (pull-requests-gateway.yaml), running the pull request's head commit with a database reset on every sync. And one of
# every entry of fin's merge queue, with the same overrides: namespace fin-pr-<number>-merge, at
# pr-<number>-merge.app.dev.fin.kfirs.com, running the entry's merge group commit, which the end-to-end suite tests
# before it lands on main (fin's docs/fin/designs/environments.md). The generators list fin's pull requests, and its
# merge queue's branches, through Argo CD's GitHub App (Secret github-app, platform/argocd) every minute; when a pull
# request closes, or the queue deletes an entry's branch, its Application goes and the resources finalizer deletes the
# deployment, namespace and database included. Each generator names the environment (env) and the commit (revision)
# from a pull request's number and head SHA, or from an entry's branch and its SHA, never from a title; the template
# uses those alone. No CreateNamespace: deploy/ holds the Namespace, which Argo CD creates before anything else.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fin-pull-requests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - pullRequest:
        github:
          owner: arikkfir-org
          repo: fin
          appSecretName: github-app
        requeueAfterSeconds: 60
        values:
          env: "pr-{{ .number }}"
          revision: "{{ .head_sha }}"
    # An entry's branch is gh-readonly-queue/main/pr-<number>-<SHA>: the merge group that ends with pull request
    # <number>, on main at <SHA>. The App, installed on fin alone, lists only fin's branches.
    - scmProvider:
        github:
          organization: arikkfir-org
          appSecretName: github-app
          allBranches: true
        filters:
          - repositoryMatch: ^fin$
            branchMatch: ^gh-readonly-queue/main/pr-[1-9][0-9]*-[0-9a-f]+$
        requeueAfterSeconds: 60
        values:
          env: '{{ regexReplaceAll "^gh-readonly-queue/main/pr-([0-9]+)-[0-9a-f]+$" .branch "pr-${1}-merge" }}'
          revision: "{{ .sha }}"
  template:
    metadata:
      name: "fin-{{ .values.env }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: fin-pull-requests
      destination:
        server: https://kubernetes.default.svc
        namespace: "fin-{{ .values.env }}"
      # deploy/ as written is production; this is what differs for a pull request. The patches run before deploy/'s
      # replacements, so ConfigMap environment's data reaches every host name and FIN_ENVIRONMENT.
      source:
        repoURL: https://github.com/arikkfir-org/fin
        targetRevision: "{{ .values.revision }}"
        path: deploy
        kustomize:
          namespace: "fin-{{ .values.env }}"
          # Fin's preview pipeline publishes every pushed commit's images, and every merge group's, to previews, which
          # only these deployments pull from.
          images:
            - "fin-api=me-west1-docker.pkg.dev/arikkfir/previews/fin-api:${ARGOCD_APP_REVISION_SHORT}"
            - "fin-worker=me-west1-docker.pkg.dev/arikkfir/previews/fin-worker:${ARGOCD_APP_REVISION_SHORT}"
            - "fin-scraper=me-west1-docker.pkg.dev/arikkfir/previews/fin-scraper:${ARGOCD_APP_REVISION_SHORT}"
            - "fin-web=me-west1-docker.pkg.dev/arikkfir/previews/fin-web:${ARGOCD_APP_REVISION_SHORT}"
            - "fin-migrations=me-west1-docker.pkg.dev/arikkfir/previews/fin-migrations:${ARGOCD_APP_REVISION_SHORT}"
          # A pull request has no availability to keep.
          replicas:
            - name: api
              count: 1
            - name: web
              count: 1
          patches:
            - target:
                kind: ConfigMap
                name: environment
              patch: |-
                - op: replace
                  path: /data
                  value:
                    name: "{{ .values.env }}"
                    app: "{{ .values.env }}.app.dev.fin.kfirs.com"
            # The shared Gateway serves the pull request with its one certificate: none of its own, and its routes
            # attach there, each to the listener its host matches.
            - target:
                kind: Gateway
                name: fin
              patch: |-
                $patch: delete
                apiVersion: gateway.networking.k8s.io/v1
                kind: Gateway
                metadata:
                  name: fin
            - target:
                kind: Certificate
                name: fin
              patch: |-
                $patch: delete
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: fin
            - target:
                kind: HTTPRoute
              patch: |-
                - op: replace
                  path: /spec/parentRefs
                  value:
                    - group: gateway.networking.k8s.io
                      kind: Gateway
                      namespace: traefik
                      name: fin-pull-requests
            # Keeps Secret Manager out of the namespace's reach (ClusterSecretStore gcp-secret-manager's conditions),
            # and lets the namespace go with the pull request.
            - target:
                kind: Namespace
              patch: |-
                - op: add
                  path: /metadata/labels/kfirs.com~1pull-request
                  value: "true"
                - op: remove
                  path: /metadata/annotations/argocd.argoproj.io~1sync-options
            - target:
                kind: ResourceQuota
                name: fin
              patch: |-
                - op: replace
                  path: /spec/hard
                  value:
                    requests.cpu: "2"
                    requests.memory: 4Gi
                    limits.memory: 8Gi
                    pods: "15"
                    persistentvolumeclaims: "1"
                    requests.storage: 5Gi
            # One replica each: a budget would block node drains or protect nothing.
            - target:
                kind: PodDisruptionBudget
              patch: |-
                $patch: delete
                apiVersion: policy/v1
                kind: PodDisruptionBudget
                metadata:
                  name: any
            - target:
                kind: StatefulSet
                name: postgres
              patch: |-
                - op: replace
                  path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
                  value: 1Gi
            # Production's arik password is in Secret Manager; a pull request generates its own, like the others.
            - target:
                kind: ExternalSecret
                name: db-arik
              patch: |-
                - op: replace
                  path: /spec
                  value:
                    refreshPolicy: CreatedOnce
                    target:
                      name: db-arik
                      creationPolicy: Owner
                    dataFrom:
                      - sourceRef:
                          generatorRef:
                            apiVersion: generators.external-secrets.io/v1alpha1
                            kind: Password
                            name: db
          # Every deployment starts from what its migrations create: Job migrate resets the schema first. What else differs
          # inside a pull request's environment, and grants nothing, is fin's own components/pull-request: its pods run as
          # default and reach Google through pool fin-pull-requests (infra), whose grants are fixed there; its NATS
          # resources go with the namespace; it runs one replica and three scrapes at a time, with a generated sealing key
          # and Demo Bank only. A head commit that predates it deploys without it.
          components:
            - components/reset-database
            - components/pull-request
          ignoreMissingComponents: true
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Two retries, where production has ten: a sync waits in its migrate hook, up to 20 minutes a try, for images
        # preview may never build once a newer commit supersedes the build, and the end-to-end check waits 30 minutes
        # for the environment to serve its commit. Three tries still outlast preview's 50.
        retry:
          limit: 2
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - SkipDryRunOnMissingResource=true
