# Fin's environments run code from pull requests, and nothing reaches them but through their own Gateway (the edge):
# none of their Services may face beyond the cluster, or take other workloads' traffic through external IPs. Selects
# the namespaces the edge labels kfirs.com/fin-environment.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fin-cluster-ip-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - services
  validations:
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: A Service in a Fin environment must be of type ClusterIP.
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: A Service in a Fin environment must have no external IPs.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fin-cluster-ip-services
spec:
  policyName: fin-cluster-ip-services
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kfirs.com/fin-environment
          operator: Exists
