# ClusterSecretStore gcp-secret-manager reads every secret External Secrets may read, for any namespace but a pull
# request's (its conditions). So in a Fin namespace an ExternalSecret reads Secret Manager only by name, and only
# secrets named fin-*; generators are free. Matched by the namespace's name. Wave -1: in force before any deployment.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fin-external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - external-secrets.io
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - externalsecrets
  matchConditions:
    - name: fin
      expression: "request.namespace == 'fin' || request.namespace.startsWith('fin-pr-')"
    # An update that leaves the spec as it was passes: the garbage collector deletes an object with one, dropping its
    # finalizer, and an object made before this policy last tightened must still go.
    - name: changed
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  validations:
    - expression: >-
        !has(object.spec.data)
        || object.spec.data.all(d, (has(d.sourceRef) && has(d.sourceRef.generatorRef))
          || d.remoteRef.key.startsWith('fin-'))
      message: An ExternalSecret in a Fin environment reads only Secret Manager secrets named fin-*.
    - expression: >-
        !has(object.spec.dataFrom)
        || object.spec.dataFrom.all(d, (has(d.sourceRef) && has(d.sourceRef.generatorRef))
          || (has(d.extract) && !has(d.find) && d.extract.key.startsWith('fin-')))
      message: An ExternalSecret in a Fin environment reads only Secret Manager secrets named fin-*, by name.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fin-external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: fin-external-secrets
  validationActions:
    - Deny
