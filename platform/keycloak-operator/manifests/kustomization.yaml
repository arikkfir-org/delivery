apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Keycloak's own operator release: CRDs, RBAC and the operator, which watches namespace keycloak only.
  - https://github.com/keycloak/keycloak-k8s-resources//kubernetes?ref=26.8.0
patches:
  # What the operator uses, keeping its limits (hub/designs/resource-requests.md in arikkfir-org/docs).
  - target:
      kind: Deployment
      name: keycloak-operator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 20m
          memory: 320Mi
  # The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
  - target:
      kind: Deployment
      name: keycloak-operator
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kfirs.com/pool: system
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: components.gke.io/gke-managed-components
            operator: Equal
            value: "true"
            effect: NoSchedule
