# The release has none. One replica, so a drain may evict it (docs/delivery/designs/disruption-budgets.md).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak-operator
  namespace: keycloak
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-operator
