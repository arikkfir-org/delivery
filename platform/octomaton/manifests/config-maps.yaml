# The hub's settings for Octomaton's two servers, read as environment variables (envFrom). What each variable means:
# Octomaton's README. The objects of its deploy/ that carried them are handing over to these, by name
# (docs/octomaton/designs/host-agnostic.md): Prune=false until the hand-over is done.
apiVersion: v1
kind: ConfigMap
metadata:
  name: octomaton
  namespace: octomaton
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: octomaton
data:
  OCTOMATON_GITHUB_ALLOWED_OWNERS: arikkfir-org  # installations on other owners are ignored
  OCTOMATON_TEKTON_DASHBOARD_URL: https://tekton.dev.kfirs.com
  OCTOMATON_NAMESPACE_TEMPLATE: "ci-{{ .Repository.Name }}"  # rendered, then sanitized to a DNS label
  # Octomaton forwards verified push and ping deliveries so Argo CD refreshes immediately
  OCTOMATON_RELAY_URLS: http://argocd-server.argocd.svc.cluster.local/api/webhook
  OCTOMATON_RETENTION_FREE_PVCS_AFTER: 1h
  # The repository whose .octomaton.yaml declares the pipelines every repository runs
  OCTOMATON_ORGANIZATION_REPOSITORY: tooling
---
# The log view octomaton-logs reads, whose project is the quota project, and the cluster whose containers it serves.
apiVersion: v1
kind: ConfigMap
metadata:
  name: octomaton-logs
  namespace: octomaton
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: octomaton-logs
data:
  OCTOMATON_LOGS_VIEW: projects/arikkfir/locations/global/buckets/_Default/views/_Default
  OCTOMATON_LOGS_CLUSTER: hub
  OCTOMATON_LOGS_LOCATION: me-west1-a
