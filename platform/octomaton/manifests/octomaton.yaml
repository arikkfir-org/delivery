# Octomaton, namespace octomaton, at octomaton.dev. Its deployment lives with its code, in deploy/ of
# arikkfir-org/octomaton. The hub runs a version: deploy/ at the version's tag, and the images with that tag, which
# Octomaton's pipeline tag adds to the images main published for the commit. A new version deploys by a pull request
# that bumps the version here and in octomaton-logs.yaml. No CreateNamespace: deploy/ holds the Namespace, which Argo CD
# creates before anything else. No resources finalizer: deleting this Application leaves Octomaton running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: octomaton
  namespace: argocd
spec:
  project: octomaton
  destination:
    server: https://kubernetes.default.svc
    namespace: octomaton
  # deploy/ as written, with what this repository decides: the images' tag, the namespace's admission to the public
  # gateway, for GitHub's webhook deliveries, and the node pool.
  source:
    repoURL: https://github.com/arikkfir-org/octomaton
    targetRevision: v0.0.1
    path: deploy
    kustomize:
      images:
        - "me-west1-docker.pkg.dev/arikkfir/octomaton/octomaton:v0.0.1"
        - "me-west1-docker.pkg.dev/arikkfir/octomaton/octomaton-logs:v0.0.1"
      patches:
        - target:
            kind: Namespace
            name: octomaton
          patch: |-
            apiVersion: v1
            kind: Namespace
            metadata:
              name: octomaton
              labels:
                kfirs.com/public-ingress: "true"
        # Every Deployment on the system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md).
        - target:
            kind: Deployment
          patch: |-
            - op: add
              path: /spec/template/spec/nodeSelector
              value:
                kfirs.com/pool: system
            - op: add
              path: /spec/template/spec/tolerations
              value:
                - key: components.gke.io/gke-managed-components
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - SkipDryRunOnMissingResource=true
