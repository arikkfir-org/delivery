crds:
  enabled: true
  keep: true

global:
  # The system node pool, beside GKE's own components (docs/delivery/designs/node-pools.md). The chart takes
  # tolerations per component, below.
  nodeSelector:
    kfirs.com/pool: system
  leaderElection:
    # Keep the leader-election lease (and its Role) in cert-manager's own namespace rather than kube-system.
    namespace: cert-manager

# Cloud DNS is reached with the ambient Workload Identity of this KSA (cert-manager/cert-manager); no key Secret.
serviceAccount:
  name: cert-manager

# A Helm post-install hook, which Argo CD would re-run as a PostSync hook on every sync. The ClusterIssuers are applied in
# a later sync wave instead, after the webhook Deployment is healthy.
startupapicheck:
  enabled: false

# Each component tolerates the system pool's taint (global holds the selector), and requests what it uses, its memory
# limit above its peak; CPU unlimited (docs/delivery/designs/resource-requests.md).
tolerations:
  - key: components.gke.io/gke-managed-components
    operator: Equal
    value: "true"
    effect: NoSchedule
resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 256Mi
# One replica each. A rollout surges: the new pod is ready before the old one stops, and leader election keeps one
# active. A drain may evict it, ready or not (docs/delivery/designs/disruption-budgets.md). The chart sets each
# component's strategy and budget separately.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
webhook:
  tolerations:
    - key: components.gke.io/gke-managed-components
      operator: Equal
      value: "true"
      effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
cainjector:
  tolerations:
    - key: components.gke.io/gke-managed-components
      operator: Equal
      value: "true"
      effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
