# DNS-01 through Cloud DNS: zone octomaton-dev for octomaton.dev, zone kfirs-com for everything else. No
# serviceAccountSecretRef: cert-manager uses the ambient Workload Identity credentials of its KSA (allowed for
# ClusterIssuers by default). Wave 1 waits for the cert-manager webhook.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: arikkfir
            hostedZoneName: kfirs-com
      - selector:
          dnsZones:
            - octomaton.dev
        dns01:
          cloudDNS:
            project: arikkfir
            hostedZoneName: octomaton-dev
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: arikkfir
            hostedZoneName: kfirs-com
      - selector:
          dnsZones:
            - octomaton.dev
        dns01:
          cloudDNS:
            project: arikkfir
            hostedZoneName: octomaton-dev
